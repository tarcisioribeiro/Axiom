# ==============================================================================
# MindLedger — GitLab CI/CD Pipeline
# ==============================================================================

stages:
  - lint
  - typecheck
  - test
  - build
  - scan
  - deploy-staging
  - smoke-staging
  - test-load
  - test-e2e
  - promote
  - deploy-production
  - smoke-production

# ------------------------------------------------------------------------------
# Global defaults
# ------------------------------------------------------------------------------
default:
  interruptible: true

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip_cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  API_IMAGE: "$CI_REGISTRY_IMAGE/api"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  # Raise this value over time as the test suite grows (set in GitLab → Settings → CI/CD → Variables to override).
  CI_COVERAGE_THRESHOLD: "80"
  # SBOM / supply-chain tooling — pin exact versions for reproducibility.
  SYFT_VERSION: "1.18.1"
  COSIGN_VERSION: "2.4.3"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Always run the full branch pipeline on develop even when the develop→main
    # MR is already open. The promote stage needs branch pipelines to create or
    # verify the promotion MR — an MR pipeline for develop→main is not enough.
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# Base job templates
# ==============================================================================

.python_before_script: &python_before_script
  - |
    pip install --quiet --cache-dir "$PIP_CACHE_DIR" \
      -r api/requirements.txt \
      -r api/requirements-dev.txt

.python_base:
  image: python:3.12-slim
  cache:
    key:
      files:
        - api/requirements.txt
        - api/requirements-dev.txt
    paths:
      - .pip_cache/
  before_script: *python_before_script

.node_base:
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd frontend && npm ci --prefer-offline

.docker_base:
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
      # Pass public DNS servers so the daemon can resolve external hostnames
      # (e.g. the GitLab registry) even when the runner's bridge DNS times out.
      command: ["--dns", "8.8.8.8", "--dns", "8.8.4.4"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# ==============================================================================
# STAGE: lint
# ==============================================================================

lint:backend:
  extends: .python_base
  stage: lint
  script:
    - cd api
    - black --check --diff .
    - isort --check-only --diff .
    - flake8 .

lint:frontend:
  extends: .node_base
  stage: lint
  script:
    - npm run lint
    - npm run format:check

lint:migrations:
  extends: .python_base
  stage: lint
  needs:
    - lint:backend
  variables:
    SECRET_KEY: "ci-insecure-key-for-migrations-check-only"
    DEBUG: "False"
    DJANGO_SETTINGS_MODULE: "app.settings"
    ENCRYPTION_KEY: "Y2ktaW5zZWN1cmUta2V5LWZvci1taWdyYXRpb25zLWNoZWNr"  # gitleaks:allow
    DB_HOST: "localhost"
    DB_PORT: "5432"
    DB_NAME: "mindledger"
    DB_USER: "mindledger"
    DB_PASSWORD: "ci"
  script:
    - cd api
    - python manage.py makemigrations --check --dry-run

lint:bandit:
  extends: .python_base
  stage: lint
  script:
    - bandit -r api/ -x api/tests,api/\*/migrations -ll

lint:pip-audit:
  extends: .python_base
  stage: lint
  script:
    - pip-audit -r api/requirements.txt --desc

lint:npm-audit:
  extends: .node_base
  stage: lint
  script:
    - npm audit --audit-level=high

lint:commits:
  extends: .node_base
  stage: lint
  # Fetch the full git history so every commit in the MR range is reachable.
  variables:
    GIT_DEPTH: 0
  script:
    # commitlint.config.js lives at the repo root; npx resolves it from the
    # parent of the frontend/ working directory set by .node_base before_script.
    - npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:secrets:
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.27.2
    entrypoint: [""]
  stage: lint
  script:
    # Scan full git history for leaked secrets; --redact masks secret values in output.
    # gitleaks:allow comments in source suppress known false positives (e.g. CI dummy keys).
    - gitleaks detect --source . --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:k8s:
  stage: lint
  image:
    name: ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0
    entrypoint: [""]
  script:
    # kubeconform validates manifests against official Kubernetes schemas
    # without requiring a live cluster. kustomization.yaml files are excluded
    # because they use the Kustomize-specific schema, not a Kubernetes resource kind.
    # Third-party CRD schemas (e.g. cert-manager ClusterIssuer) are fetched from
    # the community CRDs catalog so they are validated rather than skipped.
    - |
      find k8s/ -name "*.yaml" -not -path "*/scripts/*" -not -name "kustomization.yaml" | sort | \
        xargs /kubeconform -strict -summary -kubernetes-version 1.29.0 \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
  rules:
    - changes:
        - k8s/**/*.yaml
        - .gitlab-ci.yml


# ==============================================================================
# STAGE: typecheck
# ==============================================================================

typecheck:backend:
  extends: .python_base
  stage: typecheck
  needs:
    - lint:backend
  variables:
    SECRET_KEY: "ci-insecure-key-for-mypy-only"
    DEBUG: "False"
    DJANGO_SETTINGS_MODULE: "app.settings"
  script:
    - cd api
    - mypy .

typecheck:frontend:
  extends: .node_base
  stage: typecheck
  needs:
    - lint:frontend
  script:
    - npm run typecheck

# ==============================================================================
# STAGE: test
# ==============================================================================

test:backend:
  extends: .python_base
  stage: test

  needs:
    - typecheck:backend

  services:
    - name: postgres:16-alpine
      alias: postgres

  variables:
    POSTGRES_DB: mindledger_test
    POSTGRES_USER: mindledger
    POSTGRES_PASSWORD: ci_test_password
    POSTGRES_HOST_AUTH_METHOD: trust

    SECRET_KEY: "ci-insecure-key-not-for-production-use"
    DEBUG: "True"
    DJANGO_SETTINGS_MODULE: app.settings
    PYTHONPATH: $CI_PROJECT_DIR/api

    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: mindledger_test
    DB_USER: mindledger
    DB_PASSWORD: ci_test_password

  before_script:
    # reaproveita o pip install
    - *python_before_script

    # extras do job
    - apt-get update && apt-get install -y postgresql-client && rm -rf /var/lib/apt/lists/*
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - export ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
    - cd api
    - python manage.py migrate --noinput

  coverage: '/(?i)total.*\s+(\d+(?:\.\d+)?%)$/'

  script:
    - pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=$CI_COVERAGE_THRESHOLD

  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api/coverage.xml

test:frontend:
  extends: .node_base
  stage: test
  needs:
    - typecheck:frontend
  script:
    - npm run test:coverage
  coverage: '/Statements\s*:\s*(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

build:storybook:
  extends: .node_base
  stage: test
  needs:
    - typecheck:frontend
  script:
    - npm run build:storybook
  artifacts:
    when: always
    paths:
      - frontend/storybook-static/
    expire_in: 7 days

# ==============================================================================
# STAGE: build
# ==============================================================================

# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   GITLAB_TOKEN              — Personal or Project Access Token with `api` scope
#                               (Developer role or higher). Used by promote:to_main to
#                               create the develop→main MR. Mark as Masked.
#                               Do NOT use $CI_JOB_TOKEN — it cannot create MRs.
#   KUBECONFIG_CONTENT        — base64-encoded kubeconfig (base64 -w0 ~/.kube/config)
#   STAGING_URL               — public URL of the staging environment (e.g. https://staging.example.com)
#   PRODUCTION_URL            — public URL of the production environment (e.g. https://example.com)
#   K6_TEST_USERNAME          — username of a pre-seeded load-test user in the staging DB
#   K6_TEST_PASSWORD          — password for the load-test user (masked variable)
#   STAGING_MINIO_ENDPOINT         — MinIO endpoint reachable from the CI runner (e.g. http://HOST:30900)
#   STAGING_MINIO_ACCESS_KEY       — MinIO access key for the staging backup bucket
#   STAGING_MINIO_SECRET_KEY       — MinIO secret key for the staging backup bucket (masked variable)
#   STAGING_MINIO_ROOT_USER        — MinIO root user for the staging cluster (also used by backup:staging)
#   STAGING_MINIO_ROOT_PASSWORD    — MinIO root password for the staging cluster (masked variable)
#   STAGING_MINIO_BUCKET           — bucket name holding staging backups (default: mindledger-backups)
#   BACKUP_ENCRYPTION_KEY          — AES-256-CBC passphrase used to encrypt staging backups (masked variable)
#   STAGING_SUPERUSER_USERNAME     — username of the staging Django superuser (for smoke test JWT)
#   STAGING_SUPERUSER_PASSWORD     — password of the staging Django superuser (masked variable)
#   PRODUCTION_SUPERUSER_USERNAME  — username of the production Django superuser (for smoke test JWT)
#   PRODUCTION_SUPERUSER_PASSWORD  — password of the production Django superuser (masked variable)
#
# Optional CI/CD variables for image signing (SBOM attestation):
#   COSIGN_PRIVATE_KEY        — base64-encoded cosign private key (masked variable); if absent, attestation is skipped.
#                               Generate with: cosign generate-key-pair && base64 -w 0 cosign.key
#                               (commit cosign.pub; store base64 output as masked variable; keep .key secret)
#   COSIGN_PASSWORD           — passphrase for COSIGN_PRIVATE_KEY (masked variable; leave empty if key has no password)

.build_base:
  extends: .docker_base
  stage: build
  interruptible: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - apk add --no-cache curl
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

build:api:
  extends: .build_base
  needs:
    - job: test:backend
    - job: test:frontend
  script:
    - docker build -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" ./api
    - docker push "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$API_IMAGE:$CI_COMMIT_SHORT_SHA" "$API_IMAGE:$CI_COMMIT_TAG"
        docker push "$API_IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$API_IMAGE:$CI_COMMIT_SHORT_SHA" "$API_IMAGE:main"
        docker push "$API_IMAGE:main"
      fi

    # ── SBOM generation (syft) ────────────────────────────────────────────────
    # Install syft at the pinned version declared in global variables.
    - |
      curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
        | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
    # Generate both CycloneDX JSON and SPDX JSON from the image just pushed.
    - |
      syft "$API_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -o cyclonedx-json=api-sbom.cdx.json \
        -o spdx-json=api-sbom.spdx.json
    # Upload both SBOM formats to the GitLab generic package registry so they
    # are stored alongside the image and retrievable outside of job artifacts.
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file api-sbom.cdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/api-sbom.cdx.json"
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file api-sbom.spdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/api-sbom.spdx.json"

    # ── Optional cosign attestation ───────────────────────────────────────────
    # Attaches the CycloneDX SBOM as a signed in-toto attestation on the image.
    # Requires COSIGN_PRIVATE_KEY (and optionally COSIGN_PASSWORD) to be set as
    # masked CI/CD variables. If not set, this step is silently skipped.
    - |
      if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
        curl -sSfL \
          "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
          -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
        printf '%s' "$COSIGN_PRIVATE_KEY" | base64 -d > /tmp/cosign.key
        COSIGN_PASSWORD="${COSIGN_PASSWORD:-}" cosign attest \
          --key /tmp/cosign.key \
          --predicate api-sbom.cdx.json \
          --type cyclonedx \
          "$API_IMAGE:$CI_COMMIT_SHORT_SHA" \
          || echo "WARNING: cosign attestation failed for api image — skipping (non-fatal)."
        rm -f /tmp/cosign.key
      else
        echo "COSIGN_PRIVATE_KEY not set — skipping image attestation."
      fi
  artifacts:
    when: always
    paths:
      - api-sbom.cdx.json
      - api-sbom.spdx.json
    expire_in: 90 days

build:frontend:
  extends: .build_base
  needs:
    - job: test:backend
    - job: test:frontend
  script:
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
        docker push "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:main"
        docker push "$FRONTEND_IMAGE:main"
      fi

    # ── SBOM generation (syft) ────────────────────────────────────────────────
    - |
      curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
        | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
    - |
      syft "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -o cyclonedx-json=frontend-sbom.cdx.json \
        -o spdx-json=frontend-sbom.spdx.json
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file frontend-sbom.cdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/frontend-sbom.cdx.json"
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file frontend-sbom.spdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/frontend-sbom.spdx.json"

    # ── Optional cosign attestation ───────────────────────────────────────────
    - |
      if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
        curl -sSfL \
          "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
          -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
        printf '%s' "$COSIGN_PRIVATE_KEY" | base64 -d > /tmp/cosign.key
        COSIGN_PASSWORD="${COSIGN_PASSWORD:-}" cosign attest \
          --key /tmp/cosign.key \
          --predicate frontend-sbom.cdx.json \
          --type cyclonedx \
          "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" \
          || echo "WARNING: cosign attestation failed for frontend image — skipping (non-fatal)."
        rm -f /tmp/cosign.key
      else
        echo "COSIGN_PRIVATE_KEY not set — skipping image attestation."
      fi
  artifacts:
    when: always
    paths:
      - frontend-sbom.cdx.json
      - frontend-sbom.spdx.json
    expire_in: 90 days

# ==============================================================================
# STAGE: scan
# ==============================================================================

.trivy_base:
  image:
    name: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    entrypoint: [""]
  stage: scan
  interruptible: false
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

scan:api:
  extends: .trivy_base
  needs:
    - job: build:api
      artifacts: true
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$API_IMAGE:$CI_COMMIT_SHORT_SHA"

scan:frontend:
  extends: .trivy_base
  needs:
    - job: build:frontend
      artifacts: true
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"

# ==============================================================================
# STAGE: deploy-staging
# ==============================================================================

deploy:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: deploy-staging
  interruptible: false
  needs:
    - job: build:api
    - job: build:frontend
    - job: scan:api
    - job: scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: staging
    url: $STAGING_URL
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    # Pause both deployments so all spec changes (configmap, service, deployment)
    # are batched into a single rollout on resume.  The image is substituted
    # directly in the YAML via sed before kubectl apply, so there is never an
    # intermediate revision with the placeholder tag 0.0.0 — which would
    # otherwise become the rollback target on rollout undo.
    - kubectl -n mindledger-staging rollout pause deployment/api deployment/frontend 2>/dev/null || true
    # Sync secrets from CI variables to the cluster.
    # Guard: abort early if any critical variable is unset/empty to avoid
    # wiping a working secret with blank values.
    - |
      for var in STAGING_DB_NAME STAGING_DB_USER STAGING_DB_PASSWORD \
                 STAGING_SECRET_KEY STAGING_ENCRYPTION_KEY \
                 STAGING_SUPERUSER_USERNAME STAGING_SUPERUSER_EMAIL STAGING_SUPERUSER_PASSWORD \
                 STAGING_MINIO_ROOT_USER STAGING_MINIO_ROOT_PASSWORD; do
        val=$(eval echo "\$$var")
        if [ -z "$val" ]; then
          echo "ERROR: required CI variable $var is not set. Aborting to avoid overwriting a working secret."
          exit 1
        fi
      done
    - kubectl -n mindledger-staging create secret generic mindledger-secrets
        --from-literal=DB_NAME="$STAGING_DB_NAME"
        --from-literal=DB_USER="$STAGING_DB_USER"
        --from-literal=DB_PASSWORD="$STAGING_DB_PASSWORD"
        --from-literal=SECRET_KEY="$STAGING_SECRET_KEY"
        --from-literal=ENCRYPTION_KEY="$STAGING_ENCRYPTION_KEY"
        --from-literal=DJANGO_SUPERUSER_USERNAME="$STAGING_SUPERUSER_USERNAME"
        --from-literal=DJANGO_SUPERUSER_EMAIL="$STAGING_SUPERUSER_EMAIL"
        --from-literal=DJANGO_SUPERUSER_PASSWORD="$STAGING_SUPERUSER_PASSWORD"
        --from-literal=REDIS_PASSWORD="$STAGING_REDIS_PASSWORD"
        --from-literal=REDIS_URL="redis://redis-service:6379/0"
        --from-literal=MINIO_ROOT_USER="$STAGING_MINIO_ROOT_USER"
        --from-literal=MINIO_ROOT_PASSWORD="$STAGING_MINIO_ROOT_PASSWORD"
        --from-literal=SENTRY_DSN="${STAGING_SENTRY_DSN:-}"
        --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f k8s/staging/ingress.yaml
    - kubectl apply -f k8s/staging/api/service.yaml
    - kubectl apply -f k8s/staging/configmap.yaml
    - kubectl apply -f k8s/staging/minio/service.yaml
    # Apply deployment specs with the real image tag substituted in-place so
    # kubectl apply creates exactly one rollout revision per deploy cycle.
    # Using sed to replace the placeholder 0.0.0 tag avoids a spurious revision
    # with the placeholder image that would otherwise be the rollback target.
    - |
      sed "s|image: .*:0\.0\.0|image: $API_IMAGE:$CI_COMMIT_SHORT_SHA|" \
        k8s/staging/api/deployment.yaml | kubectl apply -f -
    - kubectl apply -f k8s/staging/frontend/configmap-nginx.yaml
    - kubectl apply -f k8s/staging/frontend/service.yaml
    - |
      sed "s|image: .*:0\.0\.0|image: $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA|" \
        k8s/staging/frontend/deployment.yaml | kubectl apply -f -
    - kubectl -n mindledger-staging rollout resume deployment/api deployment/frontend
    - kubectl -n mindledger-staging rollout status deployment/api --timeout=1140s
    - kubectl -n mindledger-staging rollout status deployment/frontend --timeout=300s
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# seed:staging
#
# Creates (or updates) the E2E test account used by Playwright E2E tests.
# Trigger manually once after the first deploy, or any time the staging DB
# is reset. The job is idempotent — re-running is safe.
#
# Required CI/CD variables:
#   E2E_USERNAME — username for the E2E test account
#   E2E_PASSWORD — password for the E2E test account (masked)
# ==============================================================================

seed:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: deploy-staging
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
      if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
        echo "ERROR: E2E_USERNAME and E2E_PASSWORD must be set as CI/CD variables."
        exit 1
      fi
    - >-
      kubectl -n mindledger-staging exec deployment/api --
      python manage.py shell -c
      "from django.contrib.auth.models import User, Group;
      u, created = User.objects.get_or_create(username='${E2E_USERNAME}');
      u.set_password('${E2E_PASSWORD}');
      u.is_superuser = False;
      u.is_staff = False;
      u.save();
      g, _ = Group.objects.get_or_create(name='members');
      u.groups.add(g);
      print('OK:', u.username, '| created:', created, '| groups:', list(u.groups.values_list('name', flat=True)))"
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# backup:staging
#
# Ensures the staging MinIO bucket and backup CronJob are present, then
# triggers a one-off Job and waits for it to complete successfully. This
# guarantees test:backup-restore always has a fresh encrypted dump to
# download and verify.
#
# Required CI/CD variables:
#   BACKUP_ENCRYPTION_KEY      — AES-256-CBC passphrase (masked)
#   STAGING_MINIO_ROOT_USER    — MinIO root user for staging cluster
#   STAGING_MINIO_ROOT_PASSWORD — MinIO root password (masked)
# ==============================================================================

backup:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-staging
  interruptible: false
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    # Upsert the backup secret (MINIO_ENDPOINT points to the in-cluster service)
    - |
      kubectl -n mindledger-staging create secret generic mindledger-backup-secrets \
        --from-literal=BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" \
        --from-literal=MINIO_ENDPOINT="http://minio-service:9000" \
        --from-literal=MINIO_ACCESS_KEY="$STAGING_MINIO_ROOT_USER" \
        --from-literal=MINIO_SECRET_KEY="$STAGING_MINIO_ROOT_PASSWORD" \
        --dry-run=client -o yaml | kubectl apply -f -
    # Ensure the sa-backup service account and CronJob/PVC/ConfigMap exist
    - kubectl apply -f k8s/staging/serviceaccounts.yaml
    - kubectl apply -f k8s/staging/backup-cronjob.yaml
    # Trigger a one-off backup Job and wait for it to complete (timeout 10 min)
    - JOB_NAME="db-backup-ci-${CI_PIPELINE_ID}"
    - |
      kubectl -n mindledger-staging create job "$JOB_NAME" \
        --from=cronjob/mindledger-db-backup-staging
    - |
      kubectl -n mindledger-staging wait \
        --for=condition=complete "job/${JOB_NAME}" --timeout=600s \
      || {
        echo "--- backup job logs ---"
        kubectl -n mindledger-staging logs -l "job-name=${JOB_NAME}" --tail=100 || true
        exit 1
      }
    - echo "Staging backup job ${JOB_NAME} completed successfully."
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# STAGE: smoke-staging
#
# Lightweight HTTP checks run immediately after deploy:staging to catch runtime
# failures (bad env vars, failed migrations, 500 errors) before load / E2E
# tests begin. If any check fails, deploy:rollback:staging automatically
# reverts both deployments in the same stage.
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   STAGING_SUPERUSER_USERNAME — username of the Django superuser in staging
#   STAGING_SUPERUSER_PASSWORD — password for the staging superuser (masked variable)
# ==============================================================================

.smoke_base:
  image: curlimages/curl:latest
  interruptible: false

smoke:staging:
  extends: .smoke_base
  stage: smoke-staging
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    SMOKE_URL: $STAGING_URL
  script:
    - |
      set -e

      check() {
        local label="$1"
        local url="$2"
        local auth_header="${3:-}"
        local expected="${4:-200}"
        local max_retries=10
        local retry_delay=12
        local attempt=0
        local STATUS

        while [ $attempt -lt $max_retries ]; do
          if [ -n "$auth_header" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "$auth_header" "$url")
          else
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
          fi
          if [ "$STATUS" = "$expected" ]; then
            echo "OK   $label → HTTP $STATUS"
            return 0
          fi
          attempt=$((attempt + 1))
          if [ $attempt -lt $max_retries ]; then
            echo "WARN $label → HTTP $STATUS (attempt $attempt/$max_retries, retrying in ${retry_delay}s...)"
            sleep $retry_delay
          fi
        done
        echo "FAIL $label → HTTP $STATUS (expected $expected)"
        exit 1
      }

      echo "=== Smoke tests: staging ==="
      # nginx-ingress tem sync period padrão de ~60s. O sleep abaixo garante que
      # o controller tenha tido tempo suficiente para recarregar a configuração
      # após o rollout dos pods completar. Com 75s iniciais + 10 retries × 12s
      # (120s) o timeout máximo é ~195s, cobrindo com folga um reload lento.
      echo "Waiting 75s for nginx-ingress to reload configuration..."
      sleep 75
      check "/health/" "${SMOKE_URL}/health/"
      check "/ready/"  "${SMOKE_URL}/ready/"
      # Obtain a fresh JWT via cookie-based login (access token is set as an
      # HttpOnly cookie, not returned in the response body).
      SMOKE_COOKIE_JAR=$(mktemp)
      LOGIN_RESP=$(curl -s --max-time 10 \
        -c "$SMOKE_COOKIE_JAR" \
        -X POST "${SMOKE_URL}/api/v1/authentication/token/" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${STAGING_SUPERUSER_USERNAME}\",\"password\":\"${STAGING_SUPERUSER_PASSWORD}\"}" \
        2>/dev/null || true)
      # Extract access_token from Netscape cookie jar (last field on the matching line)
      SMOKE_TOKEN=$(awk '$6 == "access_token" {print $7}' "$SMOKE_COOKIE_JAR" || true)
      rm -f "$SMOKE_COOKIE_JAR"
      if [ -z "$SMOKE_TOKEN" ]; then
        echo "FAIL /api/v1/me/ — could not obtain JWT token (cookie not set)"
        echo "Login response: ${LOGIN_RESP}"
        exit 1
      fi
      check "/api/v1/me/" "${SMOKE_URL}/api/v1/me/" \
        "Authorization: Bearer ${SMOKE_TOKEN}"
      echo "=== All staging smoke tests passed ==="
  allow_failure: false

deploy:rollback:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-staging
  interruptible: false
  needs:
    - job: smoke:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_failure
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Smoke tests failed — rolling back staging deployment..."
    - kubectl -n mindledger-staging rollout undo deployment/api
    - kubectl -n mindledger-staging rollout undo deployment/frontend
    - kubectl -n mindledger-staging rollout status deployment/api --timeout=120s
    - kubectl -n mindledger-staging rollout status deployment/frontend --timeout=360s
    - echo "Staging rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig
  allow_failure: false

# Manual rollback job for staging — operators can trigger this at any point
# after deploy:staging, regardless of smoke test outcome.
rollback:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-staging
  interruptible: false
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  allow_failure: true
  environment:
    name: staging
    url: $STAGING_URL
    action: start
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Manual rollback triggered — rolling back staging deployment..."
    - kubectl -n mindledger-staging rollout undo deployment/api
    - kubectl -n mindledger-staging rollout undo deployment/frontend
    - kubectl -n mindledger-staging rollout status deployment/api --timeout=120s
    - kubectl -n mindledger-staging rollout status deployment/frontend --timeout=200s
    - echo "Staging rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# STAGE: test-load
# ==============================================================================

test:load:
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  stage: test-load
  needs:
    - job: smoke:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    # BASE_URL points at staging so the load test exercises the real deploy.
    BASE_URL: $STAGING_URL
    TEST_USERNAME: $K6_TEST_USERNAME
    TEST_PASSWORD: $K6_TEST_PASSWORD
  before_script:
    # Wait up to 90 s for the staging API liveness endpoint to return 200
    # before starting the load test. This guards against the case where the
    # pod restarts after rollout status exits (e.g. readiness probe oscillation).
    # Uses wget (BusyBox) instead of curl — curl is not available in grafana/k6:latest.
    # The awk pattern anchors to lines starting with two spaces ("^  HTTP/") so that
    # wget's own error message ("wget: server returned error: HTTP/1.1 …") is ignored.
    - |
      echo "Waiting for ${BASE_URL}/live/ to return 200..."
      for i in $(seq 1 18); do
        STATUS=$(wget -qS -T 10 -O /dev/null "${BASE_URL}/live/" 2>&1 | awk '/^  HTTP\//{print $2}' | tail -1) || true
        [ -z "$STATUS" ] && STATUS="000"
        [ "$STATUS" = "200" ] && { echo "API ready (attempt $i)"; break; }
        [ "$i" = "18" ] && { echo "ERROR: API not ready after 90s (last status: ${STATUS})"; exit 1; }
        sleep 5
      done
  script:
    - mkdir -p k6
    - k6 run --out json=k6/results.json --env BASE_URL="$BASE_URL" --env TEST_USERNAME="$TEST_USERNAME" --env TEST_PASSWORD="$TEST_PASSWORD" k6/load-test.js
  artifacts:
    when: always
    paths:
      - k6/results.json
    expire_in: 7 days
  allow_failure: false

# ==============================================================================
# STAGE: test-e2e
# ==============================================================================
#
# Runs Playwright E2E tests against the staging environment after it is
# deployed.  Tests use a pre-seeded test account (same vars as load tests).
# The mcr.microsoft.com/playwright image bundles all required browser binaries.
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   STAGING_URL     — public URL of the staging environment
#   E2E_USERNAME    — username of a test account seeded in the staging database
#   E2E_PASSWORD    — password for the E2E test account (masked variable)

test:e2e:
  image:
    name: mcr.microsoft.com/playwright:v1.58.2-noble
    entrypoint: [""]
  stage: test-e2e
  needs:
    - job: smoke:staging
    - job: test:load
    - job: seed:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    BASE_URL: $STAGING_URL
    # HOME must be writable for Playwright's browser cache
    HOME: /root
  before_script:
    # Wait up to 60 s for the staging frontend to become available.
    - |
      echo "Waiting for ${BASE_URL} to respond..."
      for i in $(seq 1 12); do
        STATUS=$(wget -qS -T 10 -O /dev/null "${BASE_URL}/" 2>&1 | awk '/^  HTTP\//{print $2}' | tail -1) || true
        [ -z "$STATUS" ] && STATUS="000"
        [ "$STATUS" = "200" ] && { echo "Frontend ready (attempt $i)"; break; }
        [ "$i" = "12" ] && { echo "ERROR: Frontend not ready after 60s (last status: ${STATUS})"; exit 1; }
        sleep 5
      done
    # Smoke-test the E2E credentials against the real login endpoint before
    # running the full test suite.  A failure here means seed:staging did not
    # create the account or the credentials are misconfigured — much clearer
    # than 20 tests timing out with a 15 s waitForURL error each.
    - |
      if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
        echo "ERROR: E2E_USERNAME and E2E_PASSWORD must be set as CI/CD variables."
        exit 1
      fi
      API_URL="${BASE_URL}/api/v1/authentication/token/"
      HTTP_STATUS=$(wget -qS --method=POST \
        --header="Content-Type: application/json" \
        --body-data="{\"username\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" \
        --server-response -O /dev/null "${API_URL}" 2>&1 | awk '/^  HTTP\//{print $2}' | tail -1) || true
      [ -z "$HTTP_STATUS" ] && HTTP_STATUS="000"
      echo "E2E credential check: HTTP ${HTTP_STATUS} (user=${E2E_USERNAME})"
      if [ "${HTTP_STATUS}" != "200" ]; then
        echo "ERROR: E2E login failed (HTTP ${HTTP_STATUS}). Verify E2E_USERNAME/E2E_PASSWORD CI variables and that seed:staging ran successfully."
        exit 1
      fi
    - cd frontend
    - npm ci --prefer-offline
    - export NODE_PATH="$(pwd)/node_modules"
  script:
    - npm run test:e2e
  after_script:
    - mkdir -p e2e-results
  artifacts:
    when: always
    paths:
      - e2e-results/
      - frontend/test-results/
    reports:
      junit: e2e-results/results.xml
    expire_in: 7 days
  allow_failure: false

# ==============================================================================
# Backup-restore validation
#
# Downloads the latest encrypted backup from the staging MinIO bucket, runs
# verify-backup.sh (decrypt → pg_restore → schema checks), then performs a
# second restore to exercise Django's system check framework against real data.
# Job fails the pipeline if any step — download, decryption, restore, schema
# validation, or manage.py check — returns a non-zero exit code.
# ==============================================================================

test:backup-restore:
  extends: .python_base
  stage: test-e2e
  interruptible: false
  needs:
    - job: deploy:staging
    - job: backup:staging
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ci_backup_restore_pw  # gitleaks:allow
    POSTGRES_HOST_AUTH_METHOD: trust
    # PGPASSWORD must match POSTGRES_PASSWORD so psql / pg_restore can connect
    PGPASSWORD: ci_backup_restore_pw          # gitleaks:allow
    PGHOST: postgres
    PGPORT: "5432"
    DB_USER: postgres
    SECRET_KEY: "ci-insecure-key-not-for-production-use"  # gitleaks:allow
    DEBUG: "False"
    DJANGO_SETTINGS_MODULE: "app.settings"
    BACKUP_DIR: "/tmp/ci-backups"
    MIN_TABLE_COUNT: "20"
    MINIO_ALIAS: "staging-minio"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - *python_before_script
    - apt-get update -qq && apt-get install -y -qq curl openssl postgresql-client && rm -rf /var/lib/apt/lists/*
    - curl -sSfL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc
    # Generate a valid Fernet key so Django's FieldEncryption initialises cleanly
    - export ENCRYPTION_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - mkdir -p "$BACKUP_DIR"
    # Configure MinIO client and fetch the latest backup from the staging bucket.
    # Try with the configured endpoint first (--insecure handles self-signed certs).
    # If the endpoint uses https:// but MinIO serves plain HTTP, fall back to http://.
    - |
      mc alias set "$MINIO_ALIAS" "$STAGING_MINIO_ENDPOINT" \
        "$STAGING_MINIO_ACCESS_KEY" "$STAGING_MINIO_SECRET_KEY" --insecure 2>/dev/null \
      || mc alias set "$MINIO_ALIAS" \
        "${STAGING_MINIO_ENDPOINT/https:\/\//http://}" \
        "$STAGING_MINIO_ACCESS_KEY" "$STAGING_MINIO_SECRET_KEY"
    - |
      LATEST_FILE=$(mc ls "${MINIO_ALIAS}/${STAGING_MINIO_BUCKET:-mindledger-backups}/db/" --json \
        | python3 -c 'import sys,json;d=[o for l in sys.stdin if l.strip() for o in [json.loads(l)] if o.get("type")=="file" and o.get("key","").endswith(".dump.enc")];sys.exit(1) if not d else print(sorted(d,key=lambda x:x["lastModified"])[-1]["key"])')
      mc cp "${MINIO_ALIAS}/${STAGING_MINIO_BUCKET:-mindledger-backups}/db/${LATEST_FILE}" \
        "${BACKUP_DIR}/${LATEST_FILE}"
      # Store filename so the script section can resolve it (before_script runs in a separate shell)
      echo "${LATEST_FILE}" > "${BACKUP_DIR}/.ci_latest"
      echo "Downloaded: ${LATEST_FILE} ($(du -h "${BACKUP_DIR}/${LATEST_FILE}" | cut -f1))"
  script:
    - ENC_FILE="${BACKUP_DIR}/$(cat ${BACKUP_DIR}/.ci_latest)"

    # ── Step 1: verify-backup.sh — decrypt → pg_restore → schema checks ──────
    - chmod +x api/scripts/verify-backup.sh
    - |
      BACKUP_DIR="$BACKUP_DIR" \
      PGHOST="$PGHOST" PGPORT="$PGPORT" PGPASSWORD="$PGPASSWORD" \
      DB_USER="$DB_USER" MIN_TABLE_COUNT="$MIN_TABLE_COUNT" \
      BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" \
      api/scripts/verify-backup.sh "$ENC_FILE"

    # ── Step 2: re-restore and run manage.py check ────────────────────────────
    # verify-backup.sh drops its temp DB in an EXIT trap; spin up a fresh
    # restore so Django's system check framework can verify connectivity and
    # model integrity against real data from the backup.
    - |
      RESTORE_DB="mindledger_managecheck_${CI_JOB_ID}"
      TEMP_DUMP=$(mktemp /tmp/managecheck_XXXXXX.dump)

      # Resolve versioned decryption key (mirrors verify-backup.sh logic)
      ENC_BASENAME=$(basename "$ENC_FILE")
      DECRYPT_KEY="$BACKUP_ENCRYPTION_KEY"
      if [[ "$ENC_BASENAME" =~ _kv([^.]+)\.dump\.enc$ ]]; then
        KV_VAR="BACKUP_ENCRYPTION_KEY_${BASH_REMATCH[1]}"
        [ -n "${!KV_VAR:-}" ] && DECRYPT_KEY="${!KV_VAR}"
      fi

      DECRYPT_KEY_FOR_VERIFY="$DECRYPT_KEY" \
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
          -pass "env:DECRYPT_KEY_FOR_VERIFY" \
          -in  "$ENC_FILE" -out "$TEMP_DUMP"

      createdb --host=postgres --port=5432 --username=postgres "$RESTORE_DB"
      pg_restore --host=postgres --port=5432 --username=postgres \
        --dbname="$RESTORE_DB" --no-owner --no-privileges \
        "$TEMP_DUMP" 2>&1 | grep -v '^pg_restore: warning' || true
      rm -f "$TEMP_DUMP"

      cd api
      # POSTGRES_HOST_AUTH_METHOD=trust — password is not checked by the server
      DB_HOST=postgres DB_PORT=5432 DB_NAME="$RESTORE_DB" \
        DB_USER=postgres DB_PASSWORD="" \
        python manage.py check --database default
      cd ..

      dropdb --host=postgres --port=5432 --username=postgres "$RESTORE_DB"
  allow_failure: false

# ==============================================================================
# STAGE: deploy-production
# ==============================================================================

deploy:production:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: deploy-production
  interruptible: false
  needs:
    - job: build:api
    - job: build:frontend
    - job: scan:api
    - job: scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production
    url: $PRODUCTION_URL
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    # ── 0. Guard: abort early if any required production variable is unset ───────
    - |
      for var in PRODUCTION_DB_NAME PRODUCTION_DB_USER PRODUCTION_DB_PASSWORD \
                 PRODUCTION_SECRET_KEY PRODUCTION_ENCRYPTION_KEY \
                 PRODUCTION_SUPERUSER_USERNAME PRODUCTION_SUPERUSER_EMAIL \
                 PRODUCTION_SUPERUSER_PASSWORD \
                 PRODUCTION_MINIO_ROOT_USER PRODUCTION_MINIO_ROOT_PASSWORD; do
        val=$(eval echo "\$$var")
        if [ -z "$val" ]; then
          echo "ERROR: required CI variable $var is not set. Aborting deploy."
          exit 1
        fi
      done
    # ── 1. Sync secrets from CI variables ───────────────────────────────────────
    - |
      kubectl -n mindledger create secret generic mindledger-secrets \
        --from-literal=DB_NAME="$PRODUCTION_DB_NAME" \
        --from-literal=DB_USER="$PRODUCTION_DB_USER" \
        --from-literal=DB_PASSWORD="$PRODUCTION_DB_PASSWORD" \
        --from-literal=SECRET_KEY="$PRODUCTION_SECRET_KEY" \
        --from-literal=ENCRYPTION_KEY="$PRODUCTION_ENCRYPTION_KEY" \
        --from-literal=DJANGO_SUPERUSER_USERNAME="$PRODUCTION_SUPERUSER_USERNAME" \
        --from-literal=DJANGO_SUPERUSER_EMAIL="$PRODUCTION_SUPERUSER_EMAIL" \
        --from-literal=DJANGO_SUPERUSER_PASSWORD="$PRODUCTION_SUPERUSER_PASSWORD" \
        --from-literal=REDIS_PASSWORD="${PRODUCTION_REDIS_PASSWORD:-}" \
        --from-literal=REDIS_URL="redis://redis-service:6379/0" \
        --from-literal=MINIO_ROOT_USER="$PRODUCTION_MINIO_ROOT_USER" \
        --from-literal=MINIO_ROOT_PASSWORD="$PRODUCTION_MINIO_ROOT_PASSWORD" \
        --from-literal=SENTRY_DSN="${PRODUCTION_SENTRY_DSN:-}" \
        --dry-run=client -o yaml | kubectl apply -f -
    # ── 2. Apply base manifests (idempotent — safe on every run) ─────────────────
    - kubectl apply -f k8s/base/namespace.yaml
    - kubectl apply -f k8s/base/configmap.yaml
    - kubectl apply -f k8s/serviceaccounts.yaml
    - kubectl apply -f k8s/api/pvc.yaml
    # ── 3. Sync blue-green Deployment specs + Service ────────────────────────────
    # Always apply the manifest so spec changes (volumes, probes, env) propagate.
    # The image tag is preserved from whatever is currently running so we don't
    # disturb the live slot — blue-green-switch.sh owns the image update.
    # On first bootstrap (deployment absent) the real image is substituted so
    # the standby slot has a valid image from the start (no ImagePullBackOff).
    - |
      if kubectl -n mindledger get deployment api-blue >/dev/null 2>&1; then
        CURRENT_IMAGE=$(kubectl -n mindledger get deployment api-blue \
          -o jsonpath='{.spec.template.spec.containers[0].image}')
        sed "s|image: .*:0\.0\.0|image: $CURRENT_IMAGE|" \
          k8s/api/deployment-blue.yaml | kubectl apply -f -
      else
        sed "s|image: .*:0\.0\.0|image: $API_IMAGE:$CI_COMMIT_SHORT_SHA|" \
          k8s/api/deployment-blue.yaml | kubectl apply -f -
      fi
    - |
      if kubectl -n mindledger get deployment api-green >/dev/null 2>&1; then
        CURRENT_IMAGE=$(kubectl -n mindledger get deployment api-green \
          -o jsonpath='{.spec.template.spec.containers[0].image}')
        sed "s|image: .*:0\.0\.0|image: $CURRENT_IMAGE|" \
          k8s/api/deployment-green.yaml | kubectl apply -f -
      else
        sed "s|image: .*:0\.0\.0|image: $API_IMAGE:$CI_COMMIT_SHORT_SHA|" \
          k8s/api/deployment-green.yaml | kubectl apply -f -
      fi
    - kubectl -n mindledger get svc api-service >/dev/null 2>&1 || kubectl apply -f k8s/api/service.yaml
    # ── 4. Apply frontend manifests with the current image tag ───────────────────
    - kubectl apply -f k8s/frontend/configmap-nginx.yaml
    - |
      sed "s|image: .*:0\.0\.0|image: $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA|" \
        k8s/frontend/deployment.yaml | kubectl apply -f -
    - kubectl apply -f k8s/frontend/service.yaml
    # ── 5. API: blue-green zero-downtime deploy ───────────────────────────────────
    # The script reads the active slot from the Service selector, deploys the
    # new image to the inactive slot, waits for readiness, then switches
    # traffic and scales the old slot to 0 (kept for instant rollback).
    - bash k8s/scripts/blue-green-switch.sh "$API_IMAGE:$CI_COMMIT_SHORT_SHA" mindledger api-service
    # ── 6. Frontend: wait for rollout to complete ────────────────────────────────
    - kubectl -n mindledger rollout status deployment/frontend --timeout=120s
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# STAGE: smoke-production
#
# Same HTTP checks as smoke:staging, run against the live production URL after
# deploy:production completes. On failure, deploy:rollback:production switches
# traffic back to the previous blue-green slot (kept at 0 replicas by
# blue-green-switch.sh) and restores the previous frontend revision.
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   PRODUCTION_DB_NAME              — PostgreSQL database name
#   PRODUCTION_DB_USER              — PostgreSQL username
#   PRODUCTION_DB_PASSWORD          — PostgreSQL password (masked)
#   PRODUCTION_SECRET_KEY           — Django SECRET_KEY (masked)
#   PRODUCTION_ENCRYPTION_KEY       — Fernet encryption key (masked)
#   PRODUCTION_SUPERUSER_USERNAME   — Django superuser username
#   PRODUCTION_SUPERUSER_EMAIL      — Django superuser e-mail
#   PRODUCTION_SUPERUSER_PASSWORD   — Django superuser password (masked)
#   PRODUCTION_MINIO_ROOT_USER      — MinIO root user
#   PRODUCTION_MINIO_ROOT_PASSWORD  — MinIO root password (masked)
#   PRODUCTION_REDIS_PASSWORD       — Redis password (optional, masked)
#   PRODUCTION_SENTRY_DSN           — Sentry DSN (optional)
# ==============================================================================

smoke:production:
  extends: .smoke_base
  stage: smoke-production
  needs:
    - job: deploy:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    SMOKE_URL: $PRODUCTION_URL
  script:
    - |
      set -e

      check() {
        local label="$1"
        local url="$2"
        local auth_header="${3:-}"
        local expected="${4:-200}"
        local max_retries=10
        local retry_delay=12
        local attempt=0
        local STATUS

        while [ $attempt -lt $max_retries ]; do
          if [ -n "$auth_header" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "$auth_header" "$url")
          else
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
          fi
          if [ "$STATUS" = "$expected" ]; then
            echo "OK   $label → HTTP $STATUS"
            return 0
          fi
          attempt=$((attempt + 1))
          if [ $attempt -lt $max_retries ]; then
            echo "WARN $label → HTTP $STATUS (attempt $attempt/$max_retries, retrying in ${retry_delay}s...)"
            sleep $retry_delay
          fi
        done
        echo "FAIL $label → HTTP $STATUS (expected $expected)"
        exit 1
      }

      echo "=== Smoke tests: production ==="
      # Em produção o deploy é blue-green: o ingress já existe, mas o
      # nginx-ingress pode levar até ~60s para sincronizar o novo upstream
      # após o switch de slot. Mantemos o mesmo budget de espera que staging.
      echo "Waiting 75s for nginx-ingress to reload configuration..."
      sleep 75
      check "/health/" "${SMOKE_URL}/health/"
      check "/ready/"  "${SMOKE_URL}/ready/"
      # Obtain a fresh JWT via cookie-based login (access token is set as an
      # HttpOnly cookie, not returned in the response body).
      SMOKE_COOKIE_JAR=$(mktemp)
      LOGIN_RESP=$(curl -s --max-time 10 \
        -c "$SMOKE_COOKIE_JAR" \
        -X POST "${SMOKE_URL}/api/v1/authentication/token/" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${PRODUCTION_SUPERUSER_USERNAME}\",\"password\":\"${PRODUCTION_SUPERUSER_PASSWORD}\"}" \
        2>/dev/null || true)
      # Extract access_token from Netscape cookie jar (last field on the matching line)
      SMOKE_TOKEN=$(awk '$6 == "access_token" {print $7}' "$SMOKE_COOKIE_JAR" || true)
      rm -f "$SMOKE_COOKIE_JAR"
      if [ -z "$SMOKE_TOKEN" ]; then
        echo "FAIL /api/v1/me/ — could not obtain JWT token (cookie not set)"
        echo "Login response: ${LOGIN_RESP}"
        exit 1
      fi
      check "/api/v1/me/" "${SMOKE_URL}/api/v1/me/" \
        "Authorization: Bearer ${SMOKE_TOKEN}"
      echo "=== All production smoke tests passed ==="
  allow_failure: false

deploy:rollback:production:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-production
  interruptible: false
  needs:
    - job: smoke:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Smoke tests failed — rolling back production deployment..."
    # API: blue-green rollback — the old slot is at 0 replicas, still exists.
    # Read which slot is currently active (the one just deployed), then switch
    # the Service selector back to the previous slot and scale it up.
    - |
      CURRENT_SLOT=$(kubectl -n mindledger get svc api-service \
        -o jsonpath='{.spec.selector.slot}')
      if [ "$CURRENT_SLOT" = "blue" ]; then
        ROLLBACK_SLOT="green"
      else
        ROLLBACK_SLOT="blue"
      fi
      ROLLBACK_IMAGE=$(kubectl -n mindledger get deployment/api-$ROLLBACK_SLOT \
        -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")
      ROLLBACK_SHA="${ROLLBACK_IMAGE##*:}"
      echo "Current slot: $CURRENT_SLOT — rolling back to: $ROLLBACK_SLOT (image: $ROLLBACK_IMAGE, SHA: $ROLLBACK_SHA)"
      kubectl -n mindledger scale deployment/api-$ROLLBACK_SLOT --replicas=1
      kubectl -n mindledger rollout status deployment/api-$ROLLBACK_SLOT --timeout=120s
      kubectl -n mindledger patch svc api-service \
        --type=merge \
        -p "{\"spec\":{\"selector\":{\"app\":\"api\",\"slot\":\"$ROLLBACK_SLOT\"}}}"
      kubectl -n mindledger scale deployment/api-$CURRENT_SLOT --replicas=0
      echo "API traffic restored to slot: $ROLLBACK_SLOT"
    # Frontend: derive previous revision from rollout history for an explicit,
    # traceable rollback instead of relying on the implicit undo pointer.
    - |
      PREV_REVISION=$(kubectl -n mindledger rollout history deployment/frontend \
        --no-headers 2>/dev/null | awk '{print $1}' | sort -n | tail -2 | head -1)
      PREV_IMAGE=$(kubectl -n mindledger rollout history deployment/frontend \
        --revision="$PREV_REVISION" -o jsonpath='{.spec.template.spec.containers[0].image}')
      PREV_SHA="${PREV_IMAGE##*:}"
      echo "Rolling frontend back to revision $PREV_REVISION — image: $PREV_IMAGE (SHA: $PREV_SHA)"
      kubectl -n mindledger rollout undo deployment/frontend --to-revision="$PREV_REVISION"
    - kubectl -n mindledger rollout status deployment/frontend --timeout=120s
    - echo "Production rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig
  allow_failure: false

# ==============================================================================
# STAGE: promote
#
# Runs on the develop branch after all test-e2e stage jobs complete
# successfully. Creates a Merge Request from develop → main via the GitLab
# REST API. The job is idempotent — if an open MR already exists it prints the
# URL and exits cleanly without creating a duplicate.
#
# After creating the MR the job attempts to enable "Merge when pipeline
# succeeds" (auto-merge). This is best-effort: if the MR pipeline has not
# started yet, or if project settings do not allow auto-merge, a warning is
# printed but the job still succeeds (the MR was created).
#
# Required CI/CD variable:
#   GITLAB_TOKEN  — Personal Access Token or Project Access Token with the
#                   `api` scope and Developer (or higher) role on this project.
#                   Configure it in: Settings → CI/CD → Variables (Masked).
#                   ⚠  Do NOT use $CI_JOB_TOKEN — it cannot create Merge Requests.
# ==============================================================================

promote:to_main:
  image: python:3.12-slim
  stage: promote
  interruptible: false
  needs:
    - job: test:e2e
    - job: test:backup-restore
  # CI_COMMIT_BRANCH is only populated for branch pipelines (not MR pipelines),
  # so this rule is already implicitly restricted to push events on develop.
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - |
      python3 - <<'PYEOF'
      import json, os, sys
      import urllib.request, urllib.error

      token        = os.environ.get("GITLAB_TOKEN", "")
      project_id   = os.environ["CI_PROJECT_ID"]
      api_url      = os.environ["CI_API_V4_URL"]
      pipeline_url = os.environ.get("CI_PIPELINE_URL", "")
      pipeline_id  = os.environ.get("CI_PIPELINE_ID", "")
      commit_sha   = os.environ.get("CI_COMMIT_SHORT_SHA", "")
      commit_title = os.environ.get("CI_COMMIT_TITLE", "")

      if not token:
          print("ERROR: GITLAB_TOKEN is not set.")
          print("Configure it in: Settings → CI/CD → Variables (scope: api, masked).")
          sys.exit(1)

      headers = {
          "PRIVATE-TOKEN": token,
          "Content-Type":  "application/json",
      }

      def api_call(method, path, payload=None):
          url  = f"{api_url}/projects/{project_id}{path}"
          data = json.dumps(payload).encode() if payload else None
          req  = urllib.request.Request(url, data=data, headers=headers, method=method)
          try:
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())
          except urllib.error.HTTPError as exc:
              body = exc.read().decode()
              raise RuntimeError(f"HTTP {exc.code} {exc.reason} — {body}") from exc

      # ── 1. Check for an existing open MR develop → main ─────────────────────
      print("Checking for an existing open MR (develop → main)...")
      try:
          mrs = api_call(
              "GET",
              "/merge_requests?state=opened"
              "&source_branch=develop&target_branch=main",
          )
      except RuntimeError as exc:
          print(f"ERROR: Could not query open MRs: {exc}")
          sys.exit(1)

      if mrs:
          mr = mrs[0]
          print(f"Open MR already exists: !{mr['iid']} — {mr['web_url']}")
          print("No new MR created.")
          sys.exit(0)

      # ── 2. Create the promotion MR ───────────────────────────────────────────
      print("No open MR found — creating develop → main MR...")
      from datetime import datetime, timezone
      date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
      # Build a descriptive title: date + last commit subject + SHA + pipeline ID
      title_suffix = f" · {commit_title}" if commit_title else ""
      mr_title = f"chore(release): promote develop → main — {date_str} ({commit_sha}){title_suffix}"
      # Truncate to GitLab's 255-char MR title limit
      if len(mr_title) > 255:
          mr_title = mr_title[:252] + "..."
      description = (
          "## Promoção automática\n\n"
          "Esta MR foi criada automaticamente pelo pipeline de CI/CD após todos "
          f"os testes de staging passarem para o commit `{commit_sha}`.\n\n"
          f"**Pipeline:** {pipeline_url}\n\n"
          "Revise as alterações abaixo e faça o merge quando estiver pronto."
      )
      try:
          mr = api_call("POST", "/merge_requests", {
              "source_branch":        "develop",
              "target_branch":        "main",
              "title":                mr_title,
              "description":          description,
              "remove_source_branch": False,
              "squash":               False,
          })
      except RuntimeError as exc:
          print(f"ERROR: Failed to create MR: {exc}")
          sys.exit(1)

      print(f"MR created: !{mr['iid']} — {mr['web_url']}")

      # ── 3. Enable auto-merge (best-effort) ───────────────────────────────────
      # Requires the MR pipeline to have already started and the project to
      # allow "Merge when pipeline succeeds". Failure here is non-fatal.
      print("Attempting to enable auto-merge (merge_when_pipeline_succeeds)...")
      try:
          result = api_call(
              "PUT",
              f"/merge_requests/{mr['iid']}/merge",
              {"merge_when_pipeline_succeeds": True},
          )
          print(f"Auto-merge enabled for !{result['iid']}.")
      except RuntimeError as exc:
          print(f"WARNING: Could not enable auto-merge (non-fatal): {exc}")
          print("The MR was created. Enable auto-merge manually from the MR page if needed.")

      print("promote:to_main completed successfully.")
      PYEOF
# Manual rollback job for production — operators can trigger this at any point
# after deploy:production, regardless of smoke test outcome.
# API uses the same blue-green slot-switch as the automated rollback.
rollback:production:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-production
  interruptible: false
  needs:
    - job: deploy:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true
  environment:
    name: production
    url: $PRODUCTION_URL
    action: start
  before_script:
    - echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Manual rollback triggered — rolling back production deployment..."
    - |
      CURRENT_SLOT=$(kubectl -n mindledger get svc api-service \
        -o jsonpath='{.spec.selector.slot}')
      if [ "$CURRENT_SLOT" = "blue" ]; then
        ROLLBACK_SLOT="green"
      else
        ROLLBACK_SLOT="blue"
      fi
      ROLLBACK_IMAGE=$(kubectl -n mindledger get deployment/api-$ROLLBACK_SLOT \
        -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")
      ROLLBACK_SHA="${ROLLBACK_IMAGE##*:}"
      echo "Current slot: $CURRENT_SLOT — rolling back to: $ROLLBACK_SLOT (image: $ROLLBACK_IMAGE, SHA: $ROLLBACK_SHA)"
      kubectl -n mindledger scale deployment/api-$ROLLBACK_SLOT --replicas=1
      kubectl -n mindledger rollout status deployment/api-$ROLLBACK_SLOT --timeout=120s
      kubectl -n mindledger patch svc api-service \
        --type=merge \
        -p "{\"spec\":{\"selector\":{\"app\":\"api\",\"slot\":\"$ROLLBACK_SLOT\"}}}"
      kubectl -n mindledger scale deployment/api-$CURRENT_SLOT --replicas=0
      echo "API traffic restored to slot: $ROLLBACK_SLOT"
    # Frontend: derive previous revision from rollout history for an explicit,
    # traceable rollback instead of relying on the implicit undo pointer.
    - |
      PREV_REVISION=$(kubectl -n mindledger rollout history deployment/frontend \
        --no-headers 2>/dev/null | awk '{print $1}' | sort -n | tail -2 | head -1)
      PREV_IMAGE=$(kubectl -n mindledger rollout history deployment/frontend \
        --revision="$PREV_REVISION" -o jsonpath='{.spec.template.spec.containers[0].image}')
      PREV_SHA="${PREV_IMAGE##*:}"
      echo "Rolling frontend back to revision $PREV_REVISION — image: $PREV_IMAGE (SHA: $PREV_SHA)"
      kubectl -n mindledger rollout undo deployment/frontend --to-revision="$PREV_REVISION"
    - kubectl -n mindledger rollout status deployment/frontend --timeout=120s
    - echo "Production rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig

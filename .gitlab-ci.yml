# ==============================================================================
# deploy:rollback:staging  (automático — disparado em caso de falha)
#
# Revertido automaticamente quando smoke:staging falha (when: on_failure).
# O job coleta diagnósticos antes de agir para facilitar post-mortem:
#   1. Lista todos os pods do namespace com -o wide
#   2. Extrai as últimas 80 linhas de log do pod api (ou do pod anterior se já
#      tiver crashado)
#   3. Lista os eventos recentes ordenados por criationTimestamp
#
# Após os diagnósticos executa `rollout undo` em api e frontend, revertendo
# ambos para a revisão anterior registrada no histórico do Deployment.
# O job encerra com falha se o rollback não estabilizar dentro do timeout
# (api: 120 s, frontend: 360 s), o que manterá o pipeline como FAILED e
# alertará a equipe de que o cluster está em estado inconsistente.
#
# Não possui `allow_failure: true` — um rollback mal-sucedido deve bloquear
# qualquer promoção do develop para a main.

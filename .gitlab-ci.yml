# ==============================================================================
# MindLedger — GitLab CI/CD Pipeline
# ==============================================================================

stages:
  - lint
  - typecheck
  - test
  - build
  - scan
  - deploy-staging
  - deploy-production

# ------------------------------------------------------------------------------
# Global defaults
# ------------------------------------------------------------------------------
default:
  interruptible: true

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip_cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  API_IMAGE: "$CI_REGISTRY_IMAGE/api"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# Base job templates
# ==============================================================================

.python_before_script: &python_before_script
  - |
    pip install --quiet --cache-dir "$PIP_CACHE_DIR" \
      -r api/requirements.txt \
      -r api/requirements-dev.txt

.python_base:
  image: python:3.12-slim
  cache:
    key:
      files:
        - api/requirements.txt
        - api/requirements-dev.txt
    paths:
      - .pip_cache/
  before_script: *python_before_script

.node_base:
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd frontend && npm ci --prefer-offline

.docker_base:
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# ==============================================================================
# STAGE: lint
# ==============================================================================

lint:backend:
  extends: .python_base
  stage: lint
  script:
    - cd api
    - black --check --diff .
    - isort --check-only --diff .
    - flake8 .

lint:frontend:
  extends: .node_base
  stage: lint
  script:
    - npm run lint
    - npm run format:check

lint:bandit:
  extends: .python_base
  stage: lint
  script:
    - bandit -r api/ -x api/tests,api/\*/migrations -ll

lint:pip-audit:
  extends: .python_base
  stage: lint
  script:
    - pip-audit -r api/requirements.txt --desc

lint:npm-audit:
  extends: .node_base
  stage: lint
  script:
    - npm audit --audit-level=high

# ==============================================================================
# STAGE: typecheck
# ==============================================================================

typecheck:backend:
  extends: .python_base
  stage: typecheck
  needs:
    - lint:backend
  variables:
    SECRET_KEY: "ci-insecure-key-for-mypy-only"
    DEBUG: "False"
    DJANGO_SETTINGS_MODULE: "app.settings"
  script:
    - cd api
    - mypy .

typecheck:frontend:
  extends: .node_base
  stage: typecheck
  needs:
    - lint:frontend
  script:
    - npm run typecheck

# ==============================================================================
# STAGE: test
# ==============================================================================

test:backend:
  extends: .python_base
  stage: test

  needs:
    - typecheck:backend

  services:
    - name: postgres:16-alpine
      alias: postgres

  variables:
    POSTGRES_DB: mindledger_test
    POSTGRES_USER: mindledger
    POSTGRES_PASSWORD: ci_test_password
    POSTGRES_HOST_AUTH_METHOD: trust

    SECRET_KEY: "ci-insecure-key-not-for-production-use"
    DEBUG: "True"
    DJANGO_SETTINGS_MODULE: app.settings
    PYTHONPATH: $CI_PROJECT_DIR/api

    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: mindledger_test
    DB_USER: mindledger
    DB_PASSWORD: ci_test_password

  before_script:
    # 🔁 reaproveita o pip install
    - *python_before_script

    # extras do job
    - apt-get update && apt-get install -y postgresql-client && rm -rf /var/lib/apt/lists/*
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - export ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
    - cd api
    - python manage.py migrate --noinput

  script:
    - pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml

  artifacts:
    when: always
    paths:
      - api/coverage.xml

# ==============================================================================
# STAGE: build
# ==============================================================================

# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   KUBE_CONFIG       — base64-encoded kubeconfig for the staging cluster
#   KUBE_CONFIG_PROD  — base64-encoded kubeconfig for the production cluster
#                       (can be the same value if staging & production share one cluster)
#   STAGING_URL       — public URL of the staging environment (e.g. https://staging.example.com)
#   PRODUCTION_URL    — public URL of the production environment (e.g. https://example.com)

.build_base:
  extends: .docker_base
  stage: build
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

build:api:
  extends: .build_base
  needs:
    - job: test:backend
    - job: typecheck:frontend
  script:
    - docker build -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" ./api
    - docker push "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$API_IMAGE:$CI_COMMIT_SHORT_SHA" "$API_IMAGE:$CI_COMMIT_TAG"
        docker push "$API_IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      API_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$API_IMAGE:$CI_COMMIT_SHORT_SHA")
      echo "API_IMAGE_DIGEST=$API_DIGEST" > api.env
  artifacts:
    reports:
      dotenv: api.env

build:frontend:
  extends: .build_base
  needs:
    - job: test:backend
    - job: typecheck:frontend
  script:
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
        docker push "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      FRONTEND_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA")
      echo "FRONTEND_IMAGE_DIGEST=$FRONTEND_DIGEST" > frontend.env
  artifacts:
    reports:
      dotenv: frontend.env

# ==============================================================================
# STAGE: scan
# ==============================================================================

.trivy_base:
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  stage: scan
  interruptible: false
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

scan:api:
  extends: .trivy_base
  needs:
    - job: build:api
      artifacts: true
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$API_IMAGE:$CI_COMMIT_SHORT_SHA"

scan:frontend:
  extends: .trivy_base
  needs:
    - job: build:frontend
      artifacts: true
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"

# ==============================================================================
# STAGE: deploy-staging
# ==============================================================================

deploy:staging:
  image: bitnami/kubectl:1.30
  stage: deploy-staging
  interruptible: false
  needs:
    - job: build:api
      artifacts: true
    - job: build:frontend
      artifacts: true
    - job: scan:api
    - job: scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: staging
    url: $STAGING_URL
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl -n mindledger-staging set image deployment/api api="$API_IMAGE_DIGEST"
    - kubectl -n mindledger-staging set image deployment/frontend frontend="$FRONTEND_IMAGE_DIGEST"
    - kubectl -n mindledger-staging rollout status deployment/api --timeout=300s
    - kubectl -n mindledger-staging rollout status deployment/frontend --timeout=120s
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# STAGE: deploy-production
# ==============================================================================

deploy:production:
  image: bitnami/kubectl:1.30
  stage: deploy-production
  interruptible: false
  needs:
    - job: build:api
      artifacts: true
    - job: build:frontend
      artifacts: true
    - job: scan:api
    - job: scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  environment:
    name: production
    url: $PRODUCTION_URL
  before_script:
    - echo "$KUBE_CONFIG_PROD" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl -n mindledger set image deployment/api api="$API_IMAGE_DIGEST"
    - kubectl -n mindledger set image deployment/frontend frontend="$FRONTEND_IMAGE_DIGEST"
    - kubectl -n mindledger rollout status deployment/api --timeout=300s
    - kubectl -n mindledger rollout status deployment/frontend --timeout=120s
  after_script:
    - rm -f /tmp/kubeconfig

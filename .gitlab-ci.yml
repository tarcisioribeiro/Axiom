# ==============================================================================
# Axiom — GitLab CI/CD Pipeline
# ==============================================================================

stages:
  - lint
  - typecheck
  - test
  - build
  - scan
  - deploy-staging
  - smoke-staging
  - test-backup-restore
  - deploy-production
  - smoke-production
  - cleanup

# ------------------------------------------------------------------------------
# Global defaults
# ------------------------------------------------------------------------------
default:
  interruptible: true

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip_cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  API_IMAGE: "ghcr.io/$GHCR_USERNAME/axiom-api"
  FRONTEND_IMAGE: "ghcr.io/$GHCR_USERNAME/axiom-frontend"
  # Raise this value over time as the test suite grows (set in GitLab → Settings → CI/CD → Variables to override).
  CI_COVERAGE_THRESHOLD: "80"
  # SBOM / supply-chain tooling — pin exact versions for reproducibility.
  SYFT_VERSION: "1.18.1"
  COSIGN_VERSION: "2.4.3"
  # Shallow clone by default — most jobs only need the files at HEAD, not
  # history. Jobs that need real history (lint:commits, lint:secrets) override
  # this per-job. Cuts checkout time on every job.
  GIT_DEPTH: "1"
  # Faster cache/artifact (de)compression on runners that support it (GitLab
  # Runner 14.6+). Silently ignored on older runners.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"

workflow:
  rules:
    # MR validation pipeline — the only trigger for lint/typecheck/test jobs
    # (see .rules_verify_backend/_frontend below). A plain
    # `git push` to a feature branch with no MR open must NOT create a
    # pipeline at all; opening/updating the MR is what triggers validation.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Branch pipelines are only needed for develop and main — they're the two
    # branches that build/deploy. A develop→main promotion MR pipeline is not
    # enough on its own to trigger deploy:staging (branch-scoped, not
    # MR-scoped), so develop still needs its own branch pipeline even while
    # such an MR is open.
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ==============================================================================
# Base job templates
# ==============================================================================

.python_before_script: &python_before_script
  - |
    pip install --quiet --cache-dir "$PIP_CACHE_DIR" \
      -r apps/api/requirements.txt \
      -r apps/api/requirements-dev.txt

.python_base:
  image: python:3.12-slim
  cache:
    key:
      files:
        - apps/api/requirements.txt
        - apps/api/requirements-dev.txt
    paths:
      - .pip_cache/
  before_script: *python_before_script

.node_base:
  image: node:22-alpine
  variables:
    # Skip husky's git-hook install during npm ci — CI containers never use
    # the local git hooks the prepare script sets up, so let it no-op instead
    # of even attempting the (harmless but pointless) install.
    HUSKY: "0"
  cache:
    key:
      files:
        - apps/frontend/package-lock.json
    paths:
      - .npm/
      # Caching node_modules itself (not just npm's download cache) lets the
      # before_script below skip `npm ci` entirely when the lockfile hasn't
      # changed — that's the dominant cost of this job, not just a speedup.
      - apps/frontend/node_modules/
      # eslint/prettier caches ride the same lockfile-keyed cache scope. Both
      # tools content-hash individual files internally, so an incrementally
      # updated cache stays valid across commits even though the scope key
      # itself only changes when the lockfile does.
      - apps/frontend/.eslintcache
      - apps/frontend/.prettiercache
  before_script:
    # Redirect SSH GitHub URLs to HTTPS so transitive git deps (e.g. aframe →
    # three-bmfont-text) are fetched over port 443 instead of SSH port 22,
    # which is blocked on some CI runner networks.
    # node:22-alpine ships without git — install it before git config runs.
    - apk add --no-cache git
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
    - cd apps/frontend
    # node_modules is cached above and keyed by package-lock.json's content
    # hash, so a restored non-empty directory already matches the current
    # lockfile — reinstalling would just repeat work. --no-audit/--no-fund:
    # audit runs separately in lint:npm-audit; skipping it here avoids a
    # redundant network round-trip on every node job.
    - |
      if [ -d node_modules ] && [ -n "$(ls -A node_modules 2>/dev/null)" ]; then
        echo "node_modules restored from cache (package-lock.json unchanged) — skipping npm ci"
      else
        npm ci --prefer-offline --legacy-peer-deps --no-audit --no-fund
      fi

# Runner com acesso ao cluster via túnel — network_mode=host → acesso direto a 127.0.0.1:6443.
# KUBECONFIG_CONTENT deve usar server: https://127.0.0.1:6443
# Para gerar: base64 -w0 /etc/rancher/k3s/k3s.yaml
.k8s_tunnel:
  before_script: &k8s_tunnel_before_script
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig

.docker_base:
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
      # Pass public DNS servers so the daemon can resolve external hostnames
      # (e.g. the GitLab registry) even when the runner's bridge DNS times out.
      command: ["--dns", "8.8.8.8", "--dns", "8.8.4.4"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

# ------------------------------------------------------------------------------
# Shared rules for lint/typecheck/test jobs: these are verification steps, so
# they run only when a merge request is actually being validated — never on a
# plain branch push before the MR exists (see the workflow: rules above,
# which already prevent a pipeline from being created at all in that case;
# the merge_request_event condition here is what then scopes which jobs run
# inside the MR pipeline). Once code lands on develop or main it has already
# been verified by the MR pipeline that merged it; those branches only need
# to build and deploy.
# Each variant is also scoped with `changes:` to the module it verifies, so a
# frontend-only MR doesn't trigger backend lint/typecheck/test and vice versa.
# Apply via `extends: [.base, .rules_verify_backend]` (or `_frontend`) on the
# lint, typecheck, and test jobs for that area.
# ------------------------------------------------------------------------------
.rules_verify_backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/api/**/*
        - .gitlab-ci.yml

# Same as above, scoped to apps/frontend/.
.rules_verify_frontend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/frontend/**/*
        - .gitlab-ci.yml

# ==============================================================================
# STAGE: lint
# ==============================================================================

lint:backend:
  extends:
    - .python_base
    - .rules_verify_backend
  stage: lint
  script:
    - cd apps/api
    - black --check --diff .
    - isort --check-only --diff .
    - flake8 .

lint:frontend:
  extends:
    - .node_base
    - .rules_verify_frontend
  stage: lint
  script:
    # eslint and prettier are independent of each other, so run them
    # concurrently instead of back-to-back. --cache-strategy content (not the
    # default "metadata") is required here: a fresh git checkout resets every
    # file's mtime on each pipeline run, which would make mtime-based cache
    # invalidation see every file as changed and defeat the cache entirely.
    - |
      npm run lint -- --cache --cache-location .eslintcache --cache-strategy content &
      LINT_PID=$!
      npm run format:check -- --cache --cache-location .prettiercache --cache-strategy content &
      FORMAT_PID=$!
      wait "$LINT_PID"; LINT_STATUS=$?
      wait "$FORMAT_PID"; FORMAT_STATUS=$?
      if [ "$LINT_STATUS" -ne 0 ] || [ "$FORMAT_STATUS" -ne 0 ]; then
        echo "npm run lint exited $LINT_STATUS, npm run format:check exited $FORMAT_STATUS"
        exit 1
      fi

lint:migrations:
  extends:
    - .python_base
    - .rules_verify_backend
  stage: lint
  needs:
    - lint:backend
  # lint:backend is the primary pull-push job for this cache key; avoid every
  # parallel python job re-uploading an unchanged pip cache archive.
  cache:
    policy: pull
  variables:
    SECRET_KEY: "ci-insecure-key-for-migrations-check-only"
    DEBUG: "False"
    DJANGO_SETTINGS_MODULE: "app.settings"
    ENCRYPTION_KEY: "Y2ktaW5zZWN1cmUta2V5LWZvci1taWdyYXRpb25zLWNoZWNr"  # gitleaks:allow
    DB_HOST: "localhost"
    DB_PORT: "5432"
    DB_NAME: "axiom"
    DB_USER: "axiom"
    DB_PASSWORD: "ci"
  script:
    - cd apps/api
    - python manage.py makemigrations --check --dry-run

lint:bandit:
  extends:
    - .python_base
    - .rules_verify_backend
  stage: lint
  cache:
    policy: pull
  script:
    - bandit -r apps/api/ -x apps/api/tests,apps/api/\*/migrations -ll

lint:pip-audit:
  extends:
    - .python_base
    - .rules_verify_backend
  stage: lint
  cache:
    policy: pull
  script:
    - pip-audit -r apps/api/requirements.txt --desc --vulnerability-service osv --ignore-vuln PYSEC-2025-183

lint:npm-audit:
  extends:
    - .node_base
    - .rules_verify_frontend
  stage: lint
  # lint:frontend is the primary pull-push job for this cache key.
  cache:
    policy: pull
  script:
    - npm audit --audit-level=high

lint:commits:
  extends: .node_base
  stage: lint
  cache:
    policy: pull
  # Only run on MRs targeting develop (feature/bugfix branches). A develop ->
  # main promotion MR re-bundles commits that were already linted individually
  # when they landed on develop, so re-running commitlint over that whole
  # range just re-fails on old commits (including ones that predate this hook).
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main"
  # Fetch the full git history so every commit in the MR range is reachable.
  variables:
    GIT_DEPTH: 0
  script:
    # commitlint.config.cjs lives in apps/frontend/ alongside its node_modules so that
    # @commitlint/config-conventional resolves correctly. before_script (from
    # .node_base) already cd's into apps/frontend/, so npx finds the config here.
    # .cjs extension is required because apps/frontend/package.json has "type":"module".
    - npx commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA"

lint:secrets:
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.27.2
    entrypoint: [""]
  stage: lint
  # Global GIT_DEPTH default is shallow (1) for fast checkouts elsewhere; this
  # job needs full history to actually scan it.
  variables:
    GIT_DEPTH: "0"
  script:
    # Scan full git history for leaked secrets; --redact masks secret values in output.
    # gitleaks:allow comments in source suppress known false positives (e.g. CI dummy keys).
    - gitleaks detect --source . --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:k8s:
  stage: lint
  image:
    name: ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0
    entrypoint: [""]
  cache:
    key: kubeconform-schema-cache-v1.29.0
    paths:
      - .kubeconform-cache/
  script:
    # kubeconform validates manifests against official Kubernetes schemas
    # without requiring a live cluster. kustomization.yaml files are excluded
    # because they use the Kustomize-specific schema, not a Kubernetes resource kind.
    # overlays/*/patches/*.yaml are excluded too — they are intentionally partial
    # strategic-merge fragments (e.g. just spec.template.spec.containers[0].resources),
    # not standalone manifests, so they fail required-field validation on their own.
    # The fully-rendered overlays (what actually gets applied) are validated
    # implicitly by deploy:staging / deploy:production against the real API server.
    # Third-party CRD schemas (e.g. cert-manager ClusterIssuer) are fetched from
    # the community CRDs catalog so they are validated rather than skipped.
    # -cache persists downloaded schemas across pipeline runs (via CI cache) so
    # repeat jobs don't re-fetch everything, and -n 1 serializes downloads to
    # avoid tripping transient rate-limiting/timeouts on raw.githubusercontent.com.
    - |
      mkdir -p .kubeconform-cache
      find infra/k8s/ -name "*.yaml" -not -path "*/scripts/*" -not -path "*/patches/*" -not -name "kustomization.yaml" | sort | \
        xargs /kubeconform -strict -summary -kubernetes-version 1.29.0 -n 1 \
          -cache .kubeconform-cache \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
  retry:
    max: 2
    when: script_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infra/k8s/**/*.yaml
        - .gitlab-ci.yml

# ==============================================================================
# STAGE: build
# ==============================================================================

# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   GITLAB_TOKEN              — Personal or Project Access Token with `api` scope
#                               (Developer role or higher). Used by cleanup:registry to
#                               prune old registry/package versions. Mark as Masked.
#                               Do NOT use $CI_JOB_TOKEN — it cannot list/delete via the API.
#   KUBECONFIG_CONTENT        — base64-encoded kubeconfig (base64 -w0 ~/.kube/config)
#   STAGING_URL               — public URL of the staging environment (e.g. https://staging.example.com)
#   PRODUCTION_URL            — public URL of the production environment (e.g. https://example.com)
#   STAGING_MINIO_ROOT_USER        — MinIO root user for the staging environment
#   STAGING_MINIO_ROOT_PASSWORD    — MinIO root password for the staging environment (masked variable)
#   STAGING_MINIO_ENDPOINT         — external MinIO host used by staging (see documentation/storage/infrastructure.md)
#   STAGING_MINIO_EXTERNAL_ENDPOINT — public-facing MinIO hostname for presigned URLs (staging)
#   STAGING_OLLAMA_BASE_URL        — external Ollama host used by staging (see documentation/llm/infrastructure.md)
#   STAGING_GROQ_API_KEY           — optional Groq API key, LLM cloud fallback (masked variable)
#   STAGING_ANTHROPIC_API_KEY      — optional Anthropic API key, LLM cloud fallback (masked variable)
#   STAGING_OPENAI_API_KEY         — optional OpenAI API key, LLM cloud fallback (masked variable)
#   STAGING_SUPERUSER_USERNAME     — username of the staging Django superuser (seeded via deploy:staging)
#   STAGING_SUPERUSER_PASSWORD     — password of the staging Django superuser (masked variable)
#   PRODUCTION_SUPERUSER_USERNAME  — username of the production Django superuser (for smoke test JWT)
#   PRODUCTION_SUPERUSER_PASSWORD  — password of the production Django superuser (masked variable)
#
# Optional CI/CD variables for image signing (SBOM attestation):
#   COSIGN_PRIVATE_KEY        — base64-encoded cosign private key (masked variable); if absent, attestation is skipped.
#                               Generate with: cosign generate-key-pair && base64 -w 0 cosign.key
#                               (commit cosign.pub; store base64 output as masked variable; keep .key secret)
#   COSIGN_PASSWORD           — passphrase for COSIGN_PRIVATE_KEY (masked variable; leave empty if key has no password)

.build_base:
  extends: .docker_base
  stage: build
  interruptible: false
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  variables:
    GIT_DEPTH: 2
    # Override DNS for the DinD daemon itself (not just containers it runs).
    # The --dns flag in services.command only affects child containers; the
    # daemon uses the service container's /etc/resolv.conf, which defaults to
    # the runner's DNS (1.1.1.1). Setting DOCKER_DAEMON_OPTS here causes
    # dockerd-entrypoint.sh to start dockerd with these additional flags so
    # the daemon itself also resolves external hostnames via Google DNS.
    DOCKER_DAEMON_OPTS: "--dns=8.8.8.8 --dns=8.8.4.4"
  # Caches the syft/cosign binaries (pinned by version) so they aren't
  # curl-downloaded from GitHub on every single build job.
  cache:
    key: "sbom-tools-${SYFT_VERSION}-${COSIGN_VERSION}"
    paths:
      - .sbom-tools/
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
    - apk add --no-cache curl
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

build:api:
  extends: .build_base
  needs:
    - job: test:backend
      optional: true
    - job: test:frontend
      optional: true
  script:
    # On main: try to re-tag the image already built by the develop pipeline.
    # Falls back to a full build if the develop image is not in the registry
    # (e.g. develop pipeline failed before build, or first-time setup).
    # HEAD^2 is the develop tip on a merge commit; falls back to HEAD^1 on fast-forward.
    # Fallback/direct builds pass --cache-from against the last image pushed
    # for the same branch (built with BUILDKIT_INLINE_CACHE=1) so the DinD
    # daemon — fresh on every job — can still reuse layers (apt-get, pip
    # install) instead of rebuilding them from scratch every pipeline run.
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DEVELOP_SHA=$(git rev-parse HEAD^2 2>/dev/null | cut -c1-8 \
          || git rev-parse HEAD^1 | cut -c1-8)
        if [ -n "$DEVELOP_SHA" ] && docker pull "$API_IMAGE:$DEVELOP_SHA" 2>/dev/null; then
          echo "main: re-tagging $API_IMAGE:$DEVELOP_SHA → :$CI_COMMIT_SHORT_SHA and :main"
          docker tag "$API_IMAGE:$DEVELOP_SHA" "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
          docker tag "$API_IMAGE:$DEVELOP_SHA" "$API_IMAGE:main"
          docker push "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
          docker push "$API_IMAGE:main"
        else
          echo "main: develop image ($API_IMAGE:$DEVELOP_SHA) not found — building from source"
          docker pull "$API_IMAGE:main" 2>/dev/null || true
          docker build --network=host \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg APT_CACHE_BUST="$(date +%Y%U)" \
            --cache-from "$API_IMAGE:main" \
            -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" ./apps/api
          docker tag "$API_IMAGE:$CI_COMMIT_SHORT_SHA" "$API_IMAGE:main"
          docker push "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
          docker push "$API_IMAGE:main"
        fi
      else
        docker pull "$API_IMAGE:develop" 2>/dev/null || true
        docker build --network=host \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg APT_CACHE_BUST="$(date +%Y%U)" \
          --cache-from "$API_IMAGE:develop" \
          -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" ./apps/api
        docker push "$API_IMAGE:$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
          docker tag "$API_IMAGE:$CI_COMMIT_SHORT_SHA" "$API_IMAGE:develop"
          docker push "$API_IMAGE:develop"
        fi
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          docker tag "$API_IMAGE:$CI_COMMIT_SHORT_SHA" "$API_IMAGE:$CI_COMMIT_TAG"
          docker push "$API_IMAGE:$CI_COMMIT_TAG"
        fi
      fi

    # ── SBOM generation (syft) ────────────────────────────────────────────────
    # Install syft at the pinned version declared in global variables, reusing
    # the cached binary (keyed by SYFT_VERSION) instead of curl-downloading it
    # on every build.
    - |
      mkdir -p .sbom-tools
      if [ ! -x .sbom-tools/syft ]; then
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
          | sh -s -- -b .sbom-tools "v${SYFT_VERSION}"
      fi
      export PATH="$PWD/.sbom-tools:$PATH"
    # Generate both CycloneDX JSON and SPDX JSON from the image just pushed.
    - |
      syft "$API_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -o cyclonedx-json=api-sbom.cdx.json \
        -o spdx-json=api-sbom.spdx.json
    # Upload both SBOM formats to the GitLab generic package registry so they
    # are stored alongside the image and retrievable outside of job artifacts.
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file api-sbom.cdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/api-sbom.cdx.json"
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file api-sbom.spdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/api-sbom.spdx.json"

    # ── Optional cosign attestation ───────────────────────────────────────────
    # Attaches the CycloneDX SBOM as a signed in-toto attestation on the image.
    # Requires COSIGN_PRIVATE_KEY (and optionally COSIGN_PASSWORD) to be set as
    # masked CI/CD variables. If not set, this step is silently skipped.
    # cosign binary is cached the same way as syft (keyed by COSIGN_VERSION).
    - |
      if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
        if [ ! -x .sbom-tools/cosign ]; then
          curl -sSfL \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o .sbom-tools/cosign && chmod +x .sbom-tools/cosign
        fi
        export PATH="$PWD/.sbom-tools:$PATH"
        printf '%s' "$COSIGN_PRIVATE_KEY" | base64 -d > /tmp/cosign.key
        COSIGN_PASSWORD="${COSIGN_PASSWORD:-}" cosign attest \
          --key /tmp/cosign.key \
          --predicate api-sbom.cdx.json \
          --type cyclonedx \
          "$API_IMAGE:$CI_COMMIT_SHORT_SHA" \
          || echo "WARNING: cosign attestation failed for api image — skipping (non-fatal)."
        rm -f /tmp/cosign.key
      else
        echo "COSIGN_PRIVATE_KEY not set — skipping image attestation."
      fi
  artifacts:
    when: always
    paths:
      - api-sbom.cdx.json
      - api-sbom.spdx.json
    expire_in: 90 days

build:frontend:
  extends: .build_base
  needs:
    - job: test:backend
      optional: true
    - job: test:frontend
      optional: true
  script:
    # On main: always rebuild (VITE_APP_ENV is baked into the JS bundle, so the
    # staging image from develop can't be re-tagged for production), but still
    # pass --cache-from against the previous main image (built with
    # BUILDKIT_INLINE_CACHE=1) — same VITE_APP_ENV value each time, so the
    # npm ci layer is reusable even though the app-code layers aren't.
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        echo "main: building production image with VITE_APP_ENV=production"
        docker pull "$FRONTEND_IMAGE:main" 2>/dev/null || true
        docker build --network=host \
          --build-arg VITE_APP_ENV=production \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg APK_CACHE_BUST="$(date +%Y%U)" \
          --cache-from "$FRONTEND_IMAGE:main" \
          -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" ./apps/frontend
        docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:main"
        docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$FRONTEND_IMAGE:main"
      else
        docker pull "$FRONTEND_IMAGE:develop" 2>/dev/null || true
        docker build --network=host \
          --build-arg VITE_APP_ENV=staging \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg APK_CACHE_BUST="$(date +%Y%U)" \
          --cache-from "$FRONTEND_IMAGE:develop" \
          -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" ./apps/frontend
        docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
        if [ "$CI_COMMIT_BRANCH" = "develop" ]; then
          docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:develop"
          docker push "$FRONTEND_IMAGE:develop"
        fi
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
          docker push "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
        fi
      fi

    # ── SBOM generation (syft) ────────────────────────────────────────────────
    # Reuses the cached binary from the .sbom-tools/ cache key (shared with
    # build:api) instead of curl-downloading it again.
    - |
      mkdir -p .sbom-tools
      if [ ! -x .sbom-tools/syft ]; then
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
          | sh -s -- -b .sbom-tools "v${SYFT_VERSION}"
      fi
      export PATH="$PWD/.sbom-tools:$PATH"
    - |
      syft "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -o cyclonedx-json=frontend-sbom.cdx.json \
        -o spdx-json=frontend-sbom.spdx.json
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file frontend-sbom.cdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/frontend-sbom.cdx.json"
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file frontend-sbom.spdx.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sbom/${CI_COMMIT_SHORT_SHA}/frontend-sbom.spdx.json"

    # ── Optional cosign attestation ───────────────────────────────────────────
    - |
      if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
        if [ ! -x .sbom-tools/cosign ]; then
          curl -sSfL \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o .sbom-tools/cosign && chmod +x .sbom-tools/cosign
        fi
        export PATH="$PWD/.sbom-tools:$PATH"
        printf '%s' "$COSIGN_PRIVATE_KEY" | base64 -d > /tmp/cosign.key
        COSIGN_PASSWORD="${COSIGN_PASSWORD:-}" cosign attest \
          --key /tmp/cosign.key \
          --predicate frontend-sbom.cdx.json \
          --type cyclonedx \
          "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" \
          || echo "WARNING: cosign attestation failed for frontend image — skipping (non-fatal)."
        rm -f /tmp/cosign.key
      else
        echo "COSIGN_PRIVATE_KEY not set — skipping image attestation."
      fi
  artifacts:
    when: always
    paths:
      - frontend-sbom.cdx.json
      - frontend-sbom.spdx.json
    expire_in: 90 days

# ==============================================================================
# STAGE: scan
# ==============================================================================

.trivy_base:
  image:
    name: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    entrypoint: [""]
  stage: scan
  interruptible: false
  # GHCR intermittently resets HTTP/2 streams mid-download (surfaces as
  # "stream error: stream ID N; PROTOCOL_ERROR"), which is unrelated to the
  # --timeout flag since it aborts the transfer outright rather than
  # stalling it. GODEBUG=http2client=0 forces Trivy's registry client down
  # to HTTP/1.1, which isn't affected by that reset. `retry` is kept as a
  # safety net for any other transient network failure during the pull.
  variables:
    TRIVY_USERNAME: "$GHCR_USERNAME"
    TRIVY_PASSWORD: "$GHCR_TOKEN"
    TRIVY_NO_PROGRESS: "true"
    GODEBUG: "http2client=0"
    # Persist the vulnerability DB across pipeline runs — Trivy still checks
    # freshness and re-downloads when the remote DB is newer, so this only
    # skips the download when the cached copy is already current.
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    key: trivy-db-cache-v1
    paths:
      - .trivycache/
  retry:
    max: 2
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

scan:api:
  extends: .trivy_base
  needs:
    - job: build:api
      artifacts: true
  script:
    - trivy image --scanners vuln --timeout 15m --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$API_IMAGE:$CI_COMMIT_SHORT_SHA"

scan:frontend:
  extends: .trivy_base
  needs:
    - job: build:frontend
      artifacts: true
  script:
    - trivy image --scanners vuln --timeout 15m --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"

# ==============================================================================
# STAGE: deploy-staging
# ==============================================================================

deploy:staging:
  image:
    name: alpine/k8s:1.36.2
    entrypoint: [""]
  stage: deploy-staging
  interruptible: false
  needs:
    - job: build:api
    - job: build:frontend
    - job: scan:api
    - job: scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: staging
    url: $STAGING_URL
  before_script: *k8s_tunnel_before_script
  script:
    # Pause both deployments so all spec changes (configmap, service, deployment)
    # are batched into a single rollout on resume.  The image is substituted
    # directly in the YAML via sed before kubectl apply, so there is never an
    # intermediate revision with the placeholder tag 0.0.0 — which would
    # otherwise become the rollback target on rollout undo.
    - kubectl -n axiom-staging rollout pause deployment/api deployment/frontend 2>/dev/null || true
    # Sync secrets from CI variables to the cluster.
    # Guard: abort early if any critical variable is unset/empty to avoid
    # wiping a working secret with blank values.
    - |
      for var in STAGING_DB_NAME STAGING_DB_USER STAGING_DB_PASSWORD \
                 STAGING_DB_HOST STAGING_DB_PORT \
                 STAGING_SECRET_KEY STAGING_ENCRYPTION_KEY \
                 STAGING_SUPERUSER_USERNAME STAGING_SUPERUSER_EMAIL STAGING_SUPERUSER_PASSWORD \
                 STAGING_MINIO_ROOT_USER STAGING_MINIO_ROOT_PASSWORD \
                 STAGING_MINIO_ENDPOINT STAGING_MINIO_EXTERNAL_ENDPOINT \
                 STAGING_OLLAMA_BASE_URL; do
        val=$(eval echo "\$$var")
        if [ -z "$val" ]; then
          echo "ERROR: required CI variable $var is not set. Aborting to avoid overwriting a working secret."
          exit 1
        fi
      done
    - kubectl -n axiom-staging create secret generic axiom-secrets
        --from-literal=DB_NAME="$STAGING_DB_NAME"
        --from-literal=DB_USER="$STAGING_DB_USER"
        --from-literal=DB_PASSWORD="$STAGING_DB_PASSWORD"
        --from-literal=DB_HOST="$STAGING_DB_HOST"
        --from-literal=DB_PORT="$STAGING_DB_PORT"
        --from-literal=SECRET_KEY="$STAGING_SECRET_KEY"
        --from-literal=ENCRYPTION_KEY="$STAGING_ENCRYPTION_KEY"
        --from-literal=DJANGO_SUPERUSER_USERNAME="$STAGING_SUPERUSER_USERNAME"
        --from-literal=DJANGO_SUPERUSER_EMAIL="$STAGING_SUPERUSER_EMAIL"
        --from-literal=DJANGO_SUPERUSER_PASSWORD="$STAGING_SUPERUSER_PASSWORD"
        --from-literal=REDIS_PASSWORD="$STAGING_REDIS_PASSWORD"
        --from-literal=REDIS_URL="redis://redis-service:6379/0"
        --from-literal=MINIO_ROOT_USER="$STAGING_MINIO_ROOT_USER"
        --from-literal=MINIO_ROOT_PASSWORD="$STAGING_MINIO_ROOT_PASSWORD"
        --from-literal=MINIO_ENDPOINT="$STAGING_MINIO_ENDPOINT"
        --from-literal=MINIO_EXTERNAL_ENDPOINT="$STAGING_MINIO_EXTERNAL_ENDPOINT"
        --from-literal=OLLAMA_BASE_URL="$STAGING_OLLAMA_BASE_URL"
        --from-literal=GROQ_API_KEY="${STAGING_GROQ_API_KEY:-}"
        --from-literal=ANTHROPIC_API_KEY="${STAGING_ANTHROPIC_API_KEY:-}"
        --from-literal=OPENAI_API_KEY="${STAGING_OPENAI_API_KEY:-}"
        --from-literal=SENTRY_DSN="${STAGING_SENTRY_DSN:-}"
        --dry-run=client -o yaml | kubectl apply -f -
    - |
      kubectl -n axiom-staging create secret docker-registry ghcr-pull-secret \
        --docker-server=ghcr.io \
        --docker-username="$GHCR_USERNAME" \
        --docker-password="$GHCR_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -
    # PostgreSQL, MinIO e Ollama rodam self-managed, externos ao cluster, com
    # DB_HOST/DB_PORT/MINIO_ENDPOINT/OLLAMA_BASE_URL sincronizados a partir das
    # variáveis de CI acima — nunca commitados em arquivo. Este job não
    # sincroniza a senha do banco automaticamente: se STAGING_DB_PASSWORD for
    # rotacionado, rode manualmente na VM:
    # ALTER USER <STAGING_DB_USER> WITH PASSWORD '<nova-senha>';
    # Veja documentation/database/infrastructure.md,
    # documentation/storage/infrastructure.md e
    # documentation/llm/infrastructure.md para os runbooks completos.
    # Renderiza o overlay inteiro (redis, rbac,
    # network-policy, quota, ingress, configmap, frontend) de uma vez só.
    # O frontend entra no build com a tag placeholder 0.0.0 — substituída aqui
    # via sed antes do apply, pelo mesmo motivo de sempre: nunca deixar uma
    # revisão intermediária com a imagem placeholder virar alvo de rollback.
    - |
      kubectl kustomize infra/k8s/overlays/staging \
        | sed "s|image: .*axiom-frontend:0\.0\.0|image: $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA|" \
        | kubectl apply -f -
    # API: Deployment único (sem blue-green em staging). Mesma lógica de sed
    # de sempre — ver comentário acima sobre a tag placeholder.
    - |
      sed "s|image: .*:0\.0\.0|image: $API_IMAGE:$CI_COMMIT_SHORT_SHA|" \
        infra/k8s/overlays/staging/api/deployment.yaml | kubectl apply -f -
    # Força nova revisão mesmo em retentativas do mesmo SHA (sem mudança de image
    # tag, kubectl apply não incrementa a generation nem reseta a condição
    # ProgressDeadlineExceeded residual de deploys anteriores).
    - kubectl -n axiom-staging rollout resume deployment/api deployment/frontend
    - kubectl -n axiom-staging rollout restart deployment/api deployment/frontend
    - kubectl -n axiom-staging rollout status deployment/api --timeout=1440s
    - kubectl -n axiom-staging rollout status deployment/frontend --timeout=300s
  after_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo "=== Deploy falhou — coletando diagnóstico do pod api ==="
        kubectl -n axiom-staging get pods -l app=api -o wide || true
        echo "--- describe pod ---"
        kubectl -n axiom-staging describe pod -l app=api || true
        echo "--- logs (container atual) ---"
        kubectl -n axiom-staging logs -l app=api --tail=150 || true
        echo "--- logs (container anterior, se houver) ---"
        kubectl -n axiom-staging logs -l app=api --tail=150 --previous || true
      fi
    - rm -f /tmp/kubeconfig

# ==============================================================================
# backup:staging
#
# Ensures the staging MinIO bucket and backup CronJob are present, then
# triggers a one-off Job and waits for it to complete successfully. This
# guarantees test:backup-restore always has a fresh encrypted dump to
# download and verify.
#
# Required CI/CD variables:
#   BACKUP_ENCRYPTION_KEY          — AES-256-CBC passphrase (masked)
#   STAGING_MINIO_BACKUP_ACCESS_KEY — dedicated backup IAM user, scoped read/write
#                                     to the axiom-backups-staging bucket only
#                                     (NOT the same credential as STAGING_MINIO_ROOT_USER,
#                                     which is scoped to the app's own axiom-staging bucket)
#   STAGING_MINIO_BACKUP_SECRET_KEY — secret key for the above (masked)
#   STAGING_MINIO_ENDPOINT          — external MinIO host (see documentation/storage/infrastructure.md)
# ==============================================================================

backup:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-staging
  interruptible: false
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    # Upsert the backup secret (MINIO_ENDPOINT points to the external MinIO host)
    - |
      kubectl -n axiom-staging create secret generic axiom-backup-secrets \
        --from-literal=BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" \
        --from-literal=MINIO_ENDPOINT="$STAGING_MINIO_ENDPOINT" \
        --from-literal=MINIO_ACCESS_KEY="$STAGING_MINIO_BACKUP_ACCESS_KEY" \
        --from-literal=MINIO_SECRET_KEY="$STAGING_MINIO_BACKUP_SECRET_KEY" \
        --dry-run=client -o yaml | kubectl apply -f -
    # Ensure the CronJob/PVC/ConfigMap exist. NOTE: deliberately NOT running
    # `kubectl apply -k infra/k8s/overlays/staging` here — that renders the
    # base api/frontend Deployments with their placeholder `:0.0.0` image
    # (the real tag is substituted via sed only in deploy:staging, a hard
    # `needs:` dependency of this job that has already applied the full
    # overlay correctly). Re-applying the raw kustomize output here overwrote
    # the just-deployed image with the placeholder, breaking staging with
    # ImagePullBackOff on every run of this job — see incident #18382.
    # sa-backup (required below) comes from base/serviceaccounts.yaml, also
    # already applied by deploy:staging.
    - kubectl apply -f infra/k8s/overlays/staging/backup-cronjob.yaml
    # Trigger a one-off backup Job and wait for it to complete (timeout 10 min)
    - JOB_NAME="db-backup-ci-${CI_PIPELINE_ID}"
    # Delete stale job from a previous attempt of this pipeline (retry-safe).
    - kubectl -n axiom-staging delete job "$JOB_NAME" --ignore-not-found=true 2>/dev/null || true
    - |
      kubectl -n axiom-staging create job "$JOB_NAME" \
        --from=cronjob/axiom-db-backup-staging
    # Stream the pod's logs to a file in the background as soon as it appears.
    # A fast-failing pod is deleted by the Job controller within seconds of
    # hitting backoffLimit (confirmed in incident #18382), so querying logs
    # by label AFTER the wait below is too late — "No resources found" tells
    # us nothing. Tailing live from the moment the pod is scheduled preserves
    # the failure output regardless of how quickly the pod disappears.
    - |
      : > backup-job.log
      (
        for _ in $(seq 1 60); do
          POD=$(kubectl -n axiom-staging get pods -l "job-name=${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -n "$POD" ] && break
          sleep 2
        done
        [ -n "$POD" ] && kubectl -n axiom-staging logs -f "$POD" >> backup-job.log 2>&1
      ) &
      LOG_PID=$!
    - |
      kubectl -n axiom-staging wait \
        --for=condition=complete "job/${JOB_NAME}" --timeout=600s
      WAIT_STATUS=$?
      sleep 2
      kill "$LOG_PID" 2>/dev/null || true
      wait "$LOG_PID" 2>/dev/null || true
      echo "--- backup job logs ---"
      cat backup-job.log || true
      if [ "$WAIT_STATUS" -ne 0 ]; then
        exit 1
      fi
    - echo "Staging backup job ${JOB_NAME} completed successfully."
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# STAGE: smoke-staging
#
# Lightweight HTTP checks run immediately after deploy:staging to catch runtime
# failures (bad env vars, failed migrations, 500 errors) before promoting to
# main. If any check fails, deploy:rollback:staging automatically
# reverts both deployments in the same stage.
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   STAGING_SUPERUSER_USERNAME — username of the Django superuser in staging
#   STAGING_SUPERUSER_PASSWORD — password for the staging superuser (masked variable)
# ==============================================================================

.smoke_base:
  image: curlimages/curl:latest
  interruptible: false

smoke:staging:
  extends: .smoke_base
  stage: smoke-staging
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    SMOKE_URL: $STAGING_URL
  script:
    - |
      set -e

      check() {
        local label="$1"
        local url="$2"
        local auth_header="${3:-}"
        local expected="${4:-200}"
        local max_retries=10
        local retry_delay=12
        local attempt=0
        local STATUS

        while [ $attempt -lt $max_retries ]; do
          if [ -n "$auth_header" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "$auth_header" "$url") || true
          else
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url") || true
          fi
          if [ "$STATUS" = "$expected" ]; then
            echo "OK   $label → HTTP $STATUS"
            return 0
          fi
          attempt=$((attempt + 1))
          if [ $attempt -lt $max_retries ]; then
            echo "WARN $label → HTTP $STATUS (attempt $attempt/$max_retries, retrying in ${retry_delay}s...)"
            sleep $retry_delay
          fi
        done
        echo "FAIL $label → HTTP $STATUS (expected $expected)"
        exit 1
      }

      echo "=== Smoke tests: staging ==="
      # nginx-ingress tem sync period padrão de ~60s. O sleep abaixo garante que
      # o controller tenha tido tempo suficiente para recarregar a configuração
      # após o rollout dos pods completar. Com 75s iniciais + 10 retries × (30s
      # curl + 12s delay) o timeout máximo é ~495s, cobrindo com folga um reload
      # lento. O || true nas chamadas curl evita que set -e aborte o script em
      # caso de timeout (curl exit 28) antes do loop de retry ter chance de rodar.
      echo "Waiting 75s for nginx-ingress to reload configuration..."
      sleep 75
      check "/health/" "${SMOKE_URL}/health/"
      check "/ready/"  "${SMOKE_URL}/ready/"
      # Obtain a fresh JWT via cookie-based login (access token is set as an
      # HttpOnly cookie, not returned in the response body).
      SMOKE_COOKIE_JAR=$(mktemp)
      LOGIN_RESP=$(curl -s --max-time 10 \
        -c "$SMOKE_COOKIE_JAR" \
        -X POST "${SMOKE_URL}/api/v1/authentication/token/" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${STAGING_SUPERUSER_USERNAME}\",\"password\":\"${STAGING_SUPERUSER_PASSWORD}\"}" \
        2>/dev/null || true)
      # Extract access_token from Netscape cookie jar (last field on the matching line)
      SMOKE_TOKEN=$(awk '$6 == "access_token" {print $7}' "$SMOKE_COOKIE_JAR" || true)
      rm -f "$SMOKE_COOKIE_JAR"
      if [ -z "$SMOKE_TOKEN" ]; then
        echo "FAIL /api/v1/me/ — could not obtain JWT token (cookie not set)"
        echo "Login response: ${LOGIN_RESP}"
        exit 1
      fi
      check "/api/v1/me/" "${SMOKE_URL}/api/v1/me/" \
        "Authorization: Bearer ${SMOKE_TOKEN}"
      echo "=== All staging smoke tests passed ==="
  allow_failure: false

# ==============================================================================
# deploy:rollback:staging  (automático — disparado em caso de falha)
#
# Revertido automaticamente quando smoke:staging falha (when: on_failure).
# O job coleta diagnósticos antes de agir para facilitar post-mortem:
#   1. Lista todos os pods do namespace com -o wide
#   2. Extrai as últimas 80 linhas de log do pod api (ou do pod anterior se já
#      tiver crashado)
#   3. Lista os eventos recentes ordenados por criationTimestamp
#
# Após os diagnósticos executa `rollout undo` em api e frontend, revertendo
# ambos para a revisão anterior registrada no histórico do Deployment.
# O job encerra com falha se o rollback não estabilizar dentro do timeout
# (api: 1440 s, frontend: 360 s), o que manterá o pipeline como FAILED e
# alertará a equipe de que o cluster está em estado inconsistente. O timeout
# da api é igual ao usado em deploy:staging (não os 120s conservadores de
# antes) porque o rollback recria o pod do zero e passa pela mesma
# inicialização lenta (migrations, collectstatic, sincronização de
# permissões) — 120s estourava mesmo com o rollback progredindo normalmente.
#
# Não possui `allow_failure: true` — um rollback mal-sucedido deve bloquear
# qualquer promoção do develop para a main.
# ==============================================================================
deploy:rollback:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-staging
  interruptible: false
  needs:
    - job: smoke:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_failure
  before_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Smoke tests failed — collecting diagnostics before rollback..."
    - echo "=== Pod status ==="
    - kubectl -n axiom-staging get pods -o wide
    - echo "=== API pod logs (last 80 lines) ==="
    - kubectl -n axiom-staging logs deployment/api --tail=80 2>/dev/null || kubectl -n axiom-staging logs -l app=api --tail=80 --previous 2>/dev/null || echo "(no logs available)"
    - echo "=== Recent events ==="
    - kubectl -n axiom-staging get events --sort-by=.metadata.creationTimestamp | tail -30
    - echo "Rolling back staging deployment..."
    - kubectl -n axiom-staging rollout undo deployment/api
    - kubectl -n axiom-staging rollout undo deployment/frontend
    - kubectl -n axiom-staging rollout status deployment/api --timeout=1440s
    - kubectl -n axiom-staging rollout status deployment/frontend --timeout=360s
    - echo "Staging rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig
  allow_failure: false

# ==============================================================================
# rollback:staging  (manual — acionado pelo operador)
#
# Complementa deploy:rollback:staging para os casos em que os smoke tests
# passaram mas o ambiente apresenta problemas funcionais descobertos depois
# (ex.: regressão percebida por QA, anomalia em logs de aplicação, alerta do
# Prometheus disparando minutos após o deploy).
#
# Diferenças em relação ao rollback automático:
#   - when: manual → não é acionado pelo pipeline, só por um operador na UI
#   - allow_failure: true → não bloqueia o pipeline se cancelado ou ignorado
#   - Não coleta diagnósticos (assume que o operador já os tem)
#   - Usa os mesmos comandos `rollout undo` que o rollback automático
#
# Timeout da api igual ao de deploy:staging (1440 s) pelo mesmo motivo do
# rollback automático: o pod é recriado do zero e passa pela inicialização
# lenta completa (migrations, collectstatic, sincronização de permissões).
# Frontend usa 200 s — sobem rápido, sem a mesma sequência pesada de boot.
# ==============================================================================
rollback:staging:
  image:
    name: bitnami/kubectl:latest@sha256:d80c09afa570a14cf6d32ca09ca610b5701eb0a08c655b5bb820194b218078eb
    entrypoint: [""]
  stage: smoke-staging
  interruptible: false
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  allow_failure: true
  environment:
    name: staging
    url: $STAGING_URL
    action: start
  before_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Manual rollback triggered — rolling back staging deployment..."
    - kubectl -n axiom-staging rollout undo deployment/api
    - kubectl -n axiom-staging rollout undo deployment/frontend
    - kubectl -n axiom-staging rollout status deployment/api --timeout=1440s
    - kubectl -n axiom-staging rollout status deployment/frontend --timeout=200s
    - echo "Staging rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# test:backup-restore  —  Validação end-to-end do ciclo de backup/restore
#
# Objetivo: garantir que o backup de staging pode ser decriptado e restaurado
# com sucesso, e que o schema do banco restaurado é compatível com o código
# Django atual.  Falha aqui significa que um eventual restore de emergência em
# produção também falharia.
#
# Fluxo em dois passos:
#
#   Passo 1 — verify-backup.sh
#     • Configura o cliente mc (MinIO) e baixa o artefato .sql.gz.enc mais
#       recente do bucket de staging (axiom-backups/db/).
#     • Decripta com OpenSSL AES-256-CBC + PBKDF2 (600 000 iterações) usando
#       BACKUP_ENCRYPTION_KEY (ou a chave versionada _kv<N> quando presente no
#       nome do arquivo — suporte a rotação de chave), descompacta com gunzip
#       e restaura o dump SQL simples em um banco temporário via `psql -f`,
#       executando verificações de schema (contagem mínima de tabelas
#       definida em MIN_TABLE_COUNT).
#     • Um trap EXIT garante que o banco temporário é sempre descartado, mesmo
#       em caso de falha.
#
#   Passo 2 — manage.py check
#     • Repete a decriptação/descompactação e restaura o dump em um segundo
#       banco (axiom_managecheck_<CI_JOB_ID>).
#     • Roda `python manage.py check --database default` apontado para esse
#       banco — valida que o ORM do Django não detecta inconsistências de
#       modelo contra dados reais.
#     • Descarta o banco ao final.
#
# Serviço PostgreSQL: pgvector/pgvector:pg16 em container auxiliar (alias
# "postgres").  Todos os comandos psql usam PGPASSWORD=trust.
#
# Variáveis necessárias:
#   BACKUP_ENCRYPTION_KEY            — passphrase AES-256-CBC (masked)
#   STAGING_MINIO_ENDPOINT           — endpoint MinIO acessível pelo runner
#   STAGING_MINIO_BACKUP_ACCESS_KEY  — access key do usuário de backup dedicado (staging)
#   STAGING_MINIO_BACKUP_SECRET_KEY  — secret key do usuário de backup dedicado (masked)
#   STAGING_MINIO_BUCKET             — nome do bucket (axiom-backups-staging)
# ==============================================================================

test:backup-restore:
  extends: .python_base
  stage: test-backup-restore
  interruptible: false
  needs:
    - job: deploy:staging
    - job: backup:staging
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ci_backup_restore_pw  # gitleaks:allow
    POSTGRES_HOST_AUTH_METHOD: trust
    PGPASSWORD: ci_backup_restore_pw          # gitleaks:allow
    PGHOST: postgres
    PGPORT: "5432"
    DB_USER: postgres
    SECRET_KEY: "ci-insecure-key-not-for-production-use"  # gitleaks:allow
    DEBUG: "False"
    DJANGO_SETTINGS_MODULE: "app.settings"
    BACKUP_DIR: "/tmp/ci-backups"
    MIN_TABLE_COUNT: "20"
    MINIO_ALIAS: "staging-minio"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - *python_before_script
    - apt-get update -qq && apt-get install -y -qq curl openssl postgresql-client && rm -rf /var/lib/apt/lists/*
    - curl -sSfL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc
    - export ENCRYPTION_KEY=$(python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
    - until pg_isready -h postgres -p 5432; do sleep 1; done
    - mkdir -p "$BACKUP_DIR"
    - |
      # STAGING_MINIO_ENDPOINT is a bare host:port (same convention as
      # apps/api/app/settings.py) — mc requires a scheme, so add one if
      # missing rather than assuming the variable already has it (see
      # incident #18382: this exact gap made backup:staging fail silently).
      MC_ENDPOINT="$STAGING_MINIO_ENDPOINT"
      case "$MC_ENDPOINT" in
        http://*|https://*) ;;
        *) MC_ENDPOINT="http://${MC_ENDPOINT}" ;;
      esac
      mc alias set "$MINIO_ALIAS" "$MC_ENDPOINT" \
        "$STAGING_MINIO_BACKUP_ACCESS_KEY" "$STAGING_MINIO_BACKUP_SECRET_KEY"
    - |
      LATEST_FILE=$(mc ls "${MINIO_ALIAS}/${STAGING_MINIO_BUCKET:-axiom-backups-staging}/db/" --json \
        | python3 -c 'import sys,json;d=[o for l in sys.stdin if l.strip() for o in [json.loads(l)] if o.get("type")=="file" and o.get("key","").endswith(".sql.gz.enc")];sys.exit(1) if not d else print(sorted(d,key=lambda x:x["lastModified"])[-1]["key"])')
      mc cp "${MINIO_ALIAS}/${STAGING_MINIO_BUCKET:-axiom-backups-staging}/db/${LATEST_FILE}" \
        "${BACKUP_DIR}/${LATEST_FILE}"
      echo "${LATEST_FILE}" > "${BACKUP_DIR}/.ci_latest"
      echo "Downloaded: ${LATEST_FILE} ($(du -h "${BACKUP_DIR}/${LATEST_FILE}" | cut -f1))"
  script:
    - ENC_FILE="${BACKUP_DIR}/$(cat ${BACKUP_DIR}/.ci_latest)"
    - chmod +x apps/api/scripts/verify-backup.sh
    - |
      BACKUP_DIR="$BACKUP_DIR" \
      PGHOST="$PGHOST" PGPORT="$PGPORT" PGPASSWORD="$PGPASSWORD" \
      DB_USER="$DB_USER" MIN_TABLE_COUNT="$MIN_TABLE_COUNT" \
      BACKUP_ENCRYPTION_KEY="$BACKUP_ENCRYPTION_KEY" \
      apps/api/scripts/verify-backup.sh "$ENC_FILE"
    - |
      RESTORE_DB="axiom_managecheck_${CI_JOB_ID}"
      TEMP_GZ=$(mktemp /tmp/managecheck_XXXXXX.sql.gz)
      TEMP_SQL="${TEMP_GZ%.gz}"
      ENC_BASENAME=$(basename "$ENC_FILE")
      DECRYPT_KEY="$BACKUP_ENCRYPTION_KEY"
      if [[ "$ENC_BASENAME" =~ _kv([^.]+)\.sql\.gz\.enc$ ]]; then
        KV_VAR="BACKUP_ENCRYPTION_KEY_${BASH_REMATCH[1]}"
        [ -n "${!KV_VAR:-}" ] && DECRYPT_KEY="${!KV_VAR}"
      fi
      DECRYPT_KEY_FOR_VERIFY="$DECRYPT_KEY" \
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
          -pass "env:DECRYPT_KEY_FOR_VERIFY" \
          -in  "$ENC_FILE" -out "$TEMP_GZ"
      gunzip "$TEMP_GZ"
      createdb --host=postgres --port=5432 --username=postgres "$RESTORE_DB"
      psql --host=postgres --port=5432 --username=postgres \
        --dbname="$RESTORE_DB" --set ON_ERROR_STOP=0 \
        --file="$TEMP_SQL" > /dev/null
      rm -f "$TEMP_SQL"
      cd apps/api
      DB_HOST=postgres DB_PORT=5432 DB_NAME="$RESTORE_DB" \
        DB_USER=postgres DB_PASSWORD="" \
        python manage.py check --database default
      cd ..
      dropdb --host=postgres --port=5432 --username=postgres "$RESTORE_DB"
  allow_failure: false

# ==============================================================================
# STAGE: deploy-production
# ==============================================================================

deploy:production:
  image:
    name: alpine/k8s:1.36.2
    entrypoint: [""]
  stage: deploy-production
  interruptible: false
  needs:
    - job: build:api
    - job: build:frontend
    - job: scan:api
    - job: scan:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  allow_failure: false
  environment:
    name: production
    url: $PRODUCTION_URL
  before_script: *k8s_tunnel_before_script
  script:
    # ── 0. Guard: abort early if any required production variable is unset ───────
    - |
      for var in PRODUCTION_DB_NAME PRODUCTION_DB_USER PRODUCTION_DB_PASSWORD \
                 PRODUCTION_DB_HOST PRODUCTION_DB_PORT \
                 PRODUCTION_SECRET_KEY PRODUCTION_ENCRYPTION_KEY \
                 PRODUCTION_SUPERUSER_USERNAME PRODUCTION_SUPERUSER_EMAIL \
                 PRODUCTION_SUPERUSER_PASSWORD \
                 PRODUCTION_MINIO_ROOT_USER PRODUCTION_MINIO_ROOT_PASSWORD \
                 PRODUCTION_MINIO_ENDPOINT PRODUCTION_MINIO_EXTERNAL_ENDPOINT \
                 PRODUCTION_OLLAMA_BASE_URL; do
        val=$(eval echo "\$$var")
        if [ -z "$val" ]; then
          echo "ERROR: required CI variable $var is not set. Aborting deploy."
          exit 1
        fi
      done
    # ── 1. Sync secrets from CI variables ───────────────────────────────────────
    - |
      kubectl -n axiom create secret generic axiom-secrets \
        --from-literal=DB_NAME="$PRODUCTION_DB_NAME" \
        --from-literal=DB_USER="$PRODUCTION_DB_USER" \
        --from-literal=DB_PASSWORD="$PRODUCTION_DB_PASSWORD" \
        --from-literal=DB_HOST="$PRODUCTION_DB_HOST" \
        --from-literal=DB_PORT="$PRODUCTION_DB_PORT" \
        --from-literal=SECRET_KEY="$PRODUCTION_SECRET_KEY" \
        --from-literal=ENCRYPTION_KEY="$PRODUCTION_ENCRYPTION_KEY" \
        --from-literal=DJANGO_SUPERUSER_USERNAME="$PRODUCTION_SUPERUSER_USERNAME" \
        --from-literal=DJANGO_SUPERUSER_EMAIL="$PRODUCTION_SUPERUSER_EMAIL" \
        --from-literal=DJANGO_SUPERUSER_PASSWORD="$PRODUCTION_SUPERUSER_PASSWORD" \
        --from-literal=REDIS_PASSWORD="${PRODUCTION_REDIS_PASSWORD:-}" \
        --from-literal=REDIS_URL="redis://redis-service:6379/0" \
        --from-literal=MINIO_ROOT_USER="$PRODUCTION_MINIO_ROOT_USER" \
        --from-literal=MINIO_ROOT_PASSWORD="$PRODUCTION_MINIO_ROOT_PASSWORD" \
        --from-literal=MINIO_ENDPOINT="$PRODUCTION_MINIO_ENDPOINT" \
        --from-literal=MINIO_EXTERNAL_ENDPOINT="$PRODUCTION_MINIO_EXTERNAL_ENDPOINT" \
        --from-literal=OLLAMA_BASE_URL="$PRODUCTION_OLLAMA_BASE_URL" \
        --from-literal=GROQ_API_KEY="${PRODUCTION_GROQ_API_KEY:-}" \
        --from-literal=ANTHROPIC_API_KEY="${PRODUCTION_ANTHROPIC_API_KEY:-}" \
        --from-literal=OPENAI_API_KEY="${PRODUCTION_OPENAI_API_KEY:-}" \
        --from-literal=SENTRY_DSN="${PRODUCTION_SENTRY_DSN:-}" \
        --dry-run=client -o yaml | kubectl apply -f -
    - |
      kubectl -n axiom create secret docker-registry ghcr-pull-secret \
        --docker-server=ghcr.io \
        --docker-username="$GHCR_USERNAME" \
        --docker-password="$GHCR_TOKEN" \
        --dry-run=client -o yaml | kubectl apply -f -
    # ── 2. Apply the full overlay (idempotent — safe on every run) ───────────────
    # Renders namespace, configmap, rbac, network-policy, quota, ingress,
    # redis and frontend in one shot (PostgreSQL, MinIO and Ollama all run on
    # external self-managed hosts, not in this overlay — see
    # documentation/database/infrastructure.md,
    # documentation/storage/infrastructure.md and
    # documentation/llm/infrastructure.md). The frontend
    # placeholder image (0.0.0) is substituted before it ever reaches the
    # cluster, same reasoning as always: never let a placeholder-image
    # revision become the rollback target.
    # API (blue/green) and its Service are deliberately NOT part of this
    # overlay build — see base/kustomization.yaml for why — and are handled
    # by their own bespoke steps below.
    - |
      kubectl kustomize infra/k8s/overlays/production \
        | sed "s|image: .*axiom-frontend:0\.0\.0|image: $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA|" \
        | kubectl apply -f -
    # ── 3. Sync blue-green Deployment specs + Service ────────────────────────────
    # Always apply the manifest so spec changes (volumes, probes, env) propagate.
    # The image tag is preserved from whatever is currently running so we don't
    # disturb the live slot — blue-green-switch.sh owns the image update.
    # On first bootstrap (deployment absent) the real image is substituted so
    # the standby slot has a valid image from the start (no ImagePullBackOff).
    - |
      if kubectl -n axiom get deployment api-blue >/dev/null 2>&1; then
        CURRENT_IMAGE=$(kubectl -n axiom get deployment api-blue \
          -o jsonpath='{.spec.template.spec.containers[0].image}')
        sed "s|image: .*:0\.0\.0|image: $CURRENT_IMAGE|" \
          infra/k8s/overlays/production/api/deployment-blue.yaml | kubectl apply -f -
      else
        sed "s|image: .*:0\.0\.0|image: $API_IMAGE:$CI_COMMIT_SHORT_SHA|" \
          infra/k8s/overlays/production/api/deployment-blue.yaml | kubectl apply -f -
      fi
    - |
      if kubectl -n axiom get deployment api-green >/dev/null 2>&1; then
        CURRENT_IMAGE=$(kubectl -n axiom get deployment api-green \
          -o jsonpath='{.spec.template.spec.containers[0].image}')
        sed "s|image: .*:0\.0\.0|image: $CURRENT_IMAGE|" \
          infra/k8s/overlays/production/api/deployment-green.yaml | kubectl apply -f -
      else
        sed "s|image: .*:0\.0\.0|image: $API_IMAGE:$CI_COMMIT_SHORT_SHA|" \
          infra/k8s/overlays/production/api/deployment-green.yaml | kubectl apply -f -
      fi
    - kubectl -n axiom get svc api-service >/dev/null 2>&1 || kubectl apply -f infra/k8s/overlays/production/api/service.yaml
    # ── 5. API: blue-green zero-downtime deploy ───────────────────────────────────
    # The script reads the active slot from the Service selector, deploys the
    # new image to the inactive slot, waits for readiness, then switches
    # traffic and scales the old slot to 0 (kept for instant rollback).
    - bash infra/k8s/scripts/blue-green-switch.sh "$API_IMAGE:$CI_COMMIT_SHORT_SHA" axiom api-service 2
    # ── 6. Frontend: wait for rollout to complete ────────────────────────────────
    - kubectl -n axiom rollout status deployment/frontend --timeout=120s
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# STAGE: smoke-production
#
# Lightweight HTTP healthchecks run against the live production URL right
# after deploy:production completes. On failure, deploy:rollback:production switches
# traffic back to the previous blue-green slot (kept at 0 replicas by
# blue-green-switch.sh) and restores the previous frontend revision.
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   PRODUCTION_DB_NAME              — PostgreSQL database name
#   PRODUCTION_DB_USER              — PostgreSQL username
#   PRODUCTION_DB_PASSWORD          — PostgreSQL password (masked)
#   PRODUCTION_DB_HOST               — PostgreSQL host (self-managed, same VPS as k3s; masked)
#   PRODUCTION_DB_PORT               — PostgreSQL port (too short to be maskable in GitLab)
#   PRODUCTION_SECRET_KEY           — Django SECRET_KEY (masked)
#   PRODUCTION_ENCRYPTION_KEY       — Fernet encryption key (masked)
#   PRODUCTION_SUPERUSER_USERNAME   — Django superuser username
#   PRODUCTION_SUPERUSER_EMAIL      — Django superuser e-mail
#   PRODUCTION_SUPERUSER_PASSWORD   — Django superuser password (masked)
#   PRODUCTION_MINIO_ROOT_USER      — MinIO root user
#   PRODUCTION_MINIO_ROOT_PASSWORD  — MinIO root password (masked)
#   PRODUCTION_MINIO_ENDPOINT       — external MinIO host (see documentation/storage/infrastructure.md)
#   PRODUCTION_MINIO_EXTERNAL_ENDPOINT — public-facing MinIO hostname for presigned URLs
#   PRODUCTION_OLLAMA_BASE_URL      — external Ollama host (see documentation/llm/infrastructure.md)
#   PRODUCTION_GROQ_API_KEY         — optional Groq API key, LLM cloud fallback (masked)
#   PRODUCTION_ANTHROPIC_API_KEY    — optional Anthropic API key, LLM cloud fallback (masked)
#   PRODUCTION_OPENAI_API_KEY       — optional OpenAI API key, LLM cloud fallback (masked)
#   PRODUCTION_REDIS_PASSWORD       — Redis password (optional, masked)
#   PRODUCTION_SENTRY_DSN           — Sentry DSN (optional)
# ==============================================================================

smoke:production:
  image:
    name: alpine/k8s:1.36.2
    entrypoint: [""]
  stage: smoke-production
  interruptible: false
  needs:
    - job: deploy:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script: *k8s_tunnel_before_script
  script:
    - |
      set -e

      echo "=== Smoke tests: production ==="
      # Aguarda o nginx-ingress sincronizar o upstream após o switch de slot.
      # Budget idêntico ao antigo teste externo (75s iniciais).
      echo "Waiting 75s for nginx-ingress to reload configuration..."
      sleep 75

      # Determina o slot ativo pelo selector do Service.
      ACTIVE_SLOT=$(kubectl -n axiom get svc api-service \
        -o jsonpath='{.spec.selector.slot}')
      echo "Active slot: ${ACTIVE_SLOT}"

      # Seleciona o primeiro pod Running do slot ativo.
      API_POD=$(kubectl -n axiom get pod \
        -l "app=api,slot=${ACTIVE_SLOT}" \
        --field-selector=status.phase=Running \
        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
      if [ -z "$API_POD" ]; then
        echo "FAIL: no Running API pod found for slot: ${ACTIVE_SLOT}"
        kubectl -n axiom get pods -l app=api -o wide
        exit 1
      fi
      echo "Testing via pod: ${API_POD}"

      # Função de checagem: kubectl exec → curl rodando dentro do pod.
      # Conecta a localhost:39100 (gunicorn) sem passar por NPM/nginx-ingress,
      # validando startup do Django, DB, cache e storage.
      check() {
        local label="$1"
        local path="$2"
        local token="${3:-}"
        local expected="${4:-200}"
        local max_retries=5
        local retry_delay=12
        local attempt=0
        local STATUS

        while [ $attempt -lt $max_retries ]; do
          if [ -n "$token" ]; then
            STATUS=$(kubectl -n axiom exec "$API_POD" -- \
              curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              -H "Authorization: Bearer ${token}" \
              "http://localhost:39100${path}" 2>/dev/null) || STATUS="000"
          else
            STATUS=$(kubectl -n axiom exec "$API_POD" -- \
              curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "http://localhost:39100${path}" 2>/dev/null) || STATUS="000"
          fi
          if [ "$STATUS" = "$expected" ]; then
            echo "OK   $label → HTTP $STATUS"
            return 0
          fi
          attempt=$((attempt + 1))
          if [ $attempt -lt $max_retries ]; then
            echo "WARN $label → HTTP $STATUS (attempt $attempt/$max_retries, retrying in ${retry_delay}s...)"
            sleep $retry_delay
          fi
        done
        echo "FAIL $label → HTTP $STATUS (expected $expected)"
        exit 1
      }

      check "/health/" "/health/"
      check "/ready/"  "/ready/"

      # Obtém JWT via login no endpoint de autenticação.
      # O access token é retornado como HttpOnly cookie — lemos via cookie jar no pod.
      COOKIE_FILE="/tmp/smoke_${CI_JOB_ID}.txt"
      LOGIN_STATUS=$(kubectl -n axiom exec "$API_POD" -- \
        curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
        -c "$COOKIE_FILE" \
        -X POST "http://localhost:39100/api/v1/authentication/token/" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${PRODUCTION_SUPERUSER_USERNAME}\",\"password\":\"${PRODUCTION_SUPERUSER_PASSWORD}\"}" \
        2>/dev/null) || LOGIN_STATUS="000"
      if [ "$LOGIN_STATUS" != "200" ]; then
        echo "FAIL /api/v1/authentication/token/ → HTTP ${LOGIN_STATUS} (expected 200)"
        exit 1
      fi
      echo "OK   /api/v1/authentication/token/ → HTTP ${LOGIN_STATUS}"

      SMOKE_TOKEN=$(kubectl -n axiom exec "$API_POD" -- \
        awk '$6 == "access_token" {print $7}' "$COOKIE_FILE" \
        2>/dev/null) || SMOKE_TOKEN=""
      kubectl -n axiom exec "$API_POD" -- rm -f "$COOKIE_FILE" 2>/dev/null || true

      if [ -z "$SMOKE_TOKEN" ]; then
        echo "FAIL /api/v1/me/ — could not obtain JWT token (cookie not set)"
        exit 1
      fi

      check "/api/v1/me/" "/api/v1/me/" "$SMOKE_TOKEN"
      echo "=== All production smoke tests passed ==="
  after_script:
    - rm -f /tmp/kubeconfig
  allow_failure: false

deploy:rollback:production:
  image:
    name: alpine/k8s:1.36.2
    entrypoint: [""]
  stage: smoke-production
  interruptible: false
  needs:
    - job: smoke:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
  before_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Smoke tests failed — rolling back production deployment..."
    # API: blue-green rollback — the old slot is at 0 replicas, still exists.
    # Read which slot is currently active (the one just deployed), then switch
    # the Service selector back to the previous slot and scale it up.
    - |
      CURRENT_SLOT=$(kubectl -n axiom get svc api-service \
        -o jsonpath='{.spec.selector.slot}')
      if [ "$CURRENT_SLOT" = "blue" ]; then
        ROLLBACK_SLOT="green"
      else
        ROLLBACK_SLOT="blue"
      fi
      ROLLBACK_IMAGE=$(kubectl -n axiom get deployment/api-$ROLLBACK_SLOT \
        -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")
      ROLLBACK_SHA="${ROLLBACK_IMAGE##*:}"
      echo "Current slot: $CURRENT_SLOT — rolling back to: $ROLLBACK_SLOT (image: $ROLLBACK_IMAGE, SHA: $ROLLBACK_SHA)"
      kubectl -n axiom scale deployment/api-$ROLLBACK_SLOT --replicas=2
      # Mesmo timeout usado por blue-green-switch.sh (BLUE_GREEN_TIMEOUT,
      # default 780s) — o slot volta de 0 réplicas, então passa pelo mesmo
      # boot completo (migrations, collectstatic, sincronização de
      # permissões) que um deploy novo, não pelos 120s que bastariam para
      # um pod já quente.
      kubectl -n axiom rollout status deployment/api-$ROLLBACK_SLOT --timeout=780s
      kubectl -n axiom patch svc api-service \
        --type=merge \
        -p "{\"spec\":{\"selector\":{\"app\":\"api\",\"slot\":\"$ROLLBACK_SLOT\"}}}"
      kubectl -n axiom scale deployment/api-$CURRENT_SLOT --replicas=0
      echo "API traffic restored to slot: $ROLLBACK_SLOT"
    # Frontend: derive previous revision from rollout history for an explicit,
    # traceable rollback instead of relying on the implicit undo pointer.
    - |
      PREV_REVISION=$(kubectl -n axiom rollout history deployment/frontend \
        --no-headers 2>/dev/null | awk '{print $1}' | sort -n | tail -2 | head -1)
      PREV_IMAGE=$(kubectl -n axiom rollout history deployment/frontend \
        --revision="$PREV_REVISION" -o jsonpath='{.spec.template.spec.containers[0].image}')
      PREV_SHA="${PREV_IMAGE##*:}"
      echo "Rolling frontend back to revision $PREV_REVISION — image: $PREV_IMAGE (SHA: $PREV_SHA)"
      kubectl -n axiom rollout undo deployment/frontend --to-revision="$PREV_REVISION"
    - kubectl -n axiom rollout status deployment/frontend --timeout=120s
    - echo "Production rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig
  allow_failure: false

# Manual rollback job for production — operators can trigger this at any point
# after deploy:production, regardless of smoke test outcome.
# API uses the same blue-green slot-switch as the automated rollback.
rollback:production:
  image:
    name: alpine/k8s:1.36.2
    entrypoint: [""]
  stage: smoke-production
  interruptible: false
  needs:
    - job: deploy:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true
  environment:
    name: production
    url: $PRODUCTION_URL
    action: start
  before_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "Manual rollback triggered — rolling back production deployment..."
    - |
      CURRENT_SLOT=$(kubectl -n axiom get svc api-service \
        -o jsonpath='{.spec.selector.slot}')
      if [ "$CURRENT_SLOT" = "blue" ]; then
        ROLLBACK_SLOT="green"
      else
        ROLLBACK_SLOT="blue"
      fi
      ROLLBACK_IMAGE=$(kubectl -n axiom get deployment/api-$ROLLBACK_SLOT \
        -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")
      ROLLBACK_SHA="${ROLLBACK_IMAGE##*:}"
      echo "Current slot: $CURRENT_SLOT — rolling back to: $ROLLBACK_SLOT (image: $ROLLBACK_IMAGE, SHA: $ROLLBACK_SHA)"
      kubectl -n axiom scale deployment/api-$ROLLBACK_SLOT --replicas=2
      # Mesmo timeout usado por blue-green-switch.sh (BLUE_GREEN_TIMEOUT,
      # default 780s) — o slot volta de 0 réplicas, então passa pelo mesmo
      # boot completo (migrations, collectstatic, sincronização de
      # permissões) que um deploy novo, não pelos 120s que bastariam para
      # um pod já quente.
      kubectl -n axiom rollout status deployment/api-$ROLLBACK_SLOT --timeout=780s
      kubectl -n axiom patch svc api-service \
        --type=merge \
        -p "{\"spec\":{\"selector\":{\"app\":\"api\",\"slot\":\"$ROLLBACK_SLOT\"}}}"
      kubectl -n axiom scale deployment/api-$CURRENT_SLOT --replicas=0
      echo "API traffic restored to slot: $ROLLBACK_SLOT"
    # Frontend: derive previous revision from rollout history for an explicit,
    # traceable rollback instead of relying on the implicit undo pointer.
    - |
      PREV_REVISION=$(kubectl -n axiom rollout history deployment/frontend \
        --no-headers 2>/dev/null | awk '{print $1}' | sort -n | tail -2 | head -1)
      PREV_IMAGE=$(kubectl -n axiom rollout history deployment/frontend \
        --revision="$PREV_REVISION" -o jsonpath='{.spec.template.spec.containers[0].image}')
      PREV_SHA="${PREV_IMAGE##*:}"
      echo "Rolling frontend back to revision $PREV_REVISION — image: $PREV_IMAGE (SHA: $PREV_SHA)"
      kubectl -n axiom rollout undo deployment/frontend --to-revision="$PREV_REVISION"
    - kubectl -n axiom rollout status deployment/frontend --timeout=120s
    - echo "Production rollback complete."
  after_script:
    - rm -f /tmp/kubeconfig

# ==============================================================================
# STAGE: cleanup
#
# Três jobs de limpeza automática pós-deploy:
#
#   cleanup:registry         — Remove tags antigas do Container Registry (mantém
#                              as 5 mais recentes + tags nomeadas como "main") e
#                              versões antigas do Package Registry (SBOM generic).
#                              Roda automaticamente após os builds de develop/main;
#                              também disponível como job manual em qualquer branch.
#
#   cleanup:k8s:staging      — Remove Jobs concluídos/falhados do namespace
#                              axiom-staging após cada deploy de staging.
#
#   cleanup:k8s:production   — Remove Jobs concluídos/falhados do namespace
#                              axiom após cada deploy de produção.
#
# Nota: a rotação de ReplicaSets é gerenciada automaticamente pelo Kubernetes via
# revisionHistoryLimit: 3 definido nos manifests de Deployment.
#
# Variáveis necessárias:
#   GITLAB_TOKEN       — token com scope `api` (usado por cleanup:registry)
#   KUBECONFIG_CONTENT — kubeconfig base64 (já usado pelos deploys)
# ==============================================================================

cleanup:registry:
  image: python:3.12-slim
  stage: cleanup
  interruptible: false
  allow_failure: true
  needs:
    - job: build:api
      optional: true
    - job: build:frontend
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: manual
  script:
    - |
      python3 - <<'PYEOF'
      import urllib.request, urllib.error, json, time, os, sys

      TOKEN = os.environ.get("GITLAB_TOKEN", "")
      if not TOKEN:
          print("GITLAB_TOKEN não configurado — pulando limpeza do registry.")
          sys.exit(0)

      API     = os.environ["CI_API_V4_URL"]
      PROJECT = os.environ["CI_PROJECT_ID"]
      KEEP_N  = 5
      NAMED   = {"main", "develop", "latest"}

      TRANSIENT = (429, 500, 502, 503, 504)

      def fetch(url, method="GET", max_retries=7):
          for attempt in range(max_retries):
              try:
                  req = urllib.request.Request(
                      url, headers={"PRIVATE-TOKEN": TOKEN}, method=method
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.read(), r.status
              except urllib.error.HTTPError as e:
                  if e.code in TRANSIENT and attempt < max_retries - 1:
                      wait = min(2 ** (attempt + 1), 60)
                      print(f"  HTTP {e.code} — aguardando {wait}s (tentativa {attempt+1}/{max_retries})...")
                      time.sleep(wait)
                      continue
                  raise
              except OSError as e:
                  if attempt < max_retries - 1:
                      wait = min(2 ** (attempt + 1), 60)
                      print(f"  Erro de rede ({e}) — aguardando {wait}s...")
                      time.sleep(wait)
                      continue
                  raise

      def api_get(path):
          results, page = [], 1
          while True:
              sep = "&" if "?" in path else "?"
              url = f"{API}{path}{sep}per_page=100&page={page}"
              body, _ = fetch(url)
              data = json.loads(body)
              if not data:
                  break
              results.extend(data)
              page += 1
          return results

      def api_delete(path):
          url = f"{API}{path}"
          try:
              _, status_code = fetch(url, method="DELETE")
              return status_code
          except urllib.error.HTTPError as e:
              return e.code

      # ── Container Registry ────────────────────────────────────────────────────
      print("=== Container Registry ===")
      try:
          for repo in api_get(f"/projects/{PROJECT}/registry/repositories"):
              repo_id, repo_name = repo["id"], repo["name"]
              tags = api_get(f"/projects/{PROJECT}/registry/repositories/{repo_id}/tags")

              detailed = []
              for t in tags:
                  url = f"{API}/projects/{PROJECT}/registry/repositories/{repo_id}/tags/{t['name']}"
                  body, _ = fetch(url)
                  detailed.append(json.loads(body))

              sha_sorted = sorted(
                  [t for t in detailed if t["name"] not in NAMED],
                  key=lambda t: t.get("created_at", ""),
                  reverse=True
              )
              named_count = sum(1 for t in detailed if t["name"] in NAMED)
              to_delete   = sha_sorted[KEEP_N:]
              print(f"{repo_name}: {len(tags)} tags → mantendo {len(sha_sorted[:KEEP_N]) + named_count}, deletando {len(to_delete)}")
              for t in to_delete:
                  status = api_delete(f"/projects/{PROJECT}/registry/repositories/{repo_id}/tags/{t['name']}")
                  print(f"  DELETE {t['name']} ({t.get('created_at','?')[:19]}) → HTTP {status}")
                  time.sleep(0.1)
      except (urllib.error.HTTPError, OSError) as exc:
          print(f"AVISO: Container Registry indisponível após retries ({exc}) — pulando limpeza de tags.")

      # ── Package Registry (SBOM) ───────────────────────────────────────────────
      print("\n=== Package Registry (sbom) ===")
      try:
          packages = api_get(f"/projects/{PROJECT}/packages?package_type=generic")
          sbom = sorted(
              [p for p in packages if p["name"] == "sbom"],
              key=lambda p: p.get("created_at", ""),
              reverse=True
          )
          to_delete = sbom[KEEP_N:]
          print(f"sbom: {len(sbom)} versões → mantendo {min(len(sbom), KEEP_N)}, deletando {len(to_delete)}")
          for p in to_delete:
              status = api_delete(f"/projects/{PROJECT}/packages/{p['id']}")
              print(f"  DELETE sbom/{p['version']} → HTTP {status}")
              time.sleep(0.1)
      except (urllib.error.HTTPError, OSError) as exc:
          print(f"AVISO: Package Registry indisponível após retries ({exc}) — pulando limpeza de SBOMs.")

      print("\nLimpeza do registry concluída.")
      PYEOF

cleanup:k8s:staging:
  image:
    name: alpine/k8s:1.36.2
    entrypoint: [""]
  stage: cleanup
  interruptible: false
  needs:
    - job: deploy:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
  before_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "=== Limpeza de Jobs em axiom-staging ==="
    # Jobs concluídos (succeeded >= 1)
    - |
      DONE=$(kubectl get jobs -n axiom-staging \
        -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.status.succeeded}{"\n"}{end}' \
        | awk -F= '$2 >= 1 {print $1}')
      for job in $DONE; do
        kubectl delete job -n axiom-staging "$job" --ignore-not-found=true \
          && echo "  deleted completed job/$job" || true
      done
    # Jobs falhados e inativos (failed >= 1 e active == 0)
    - |
      FAILED=$(kubectl get jobs -n axiom-staging \
        -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.status.failed}{"/"}{.status.active}{"\n"}{end}' \
        | awk -F'[=/]' '$2 >= 1 && $3 == 0 {print $1}')
      for job in $FAILED; do
        kubectl delete job -n axiom-staging "$job" --ignore-not-found=true \
          && echo "  deleted failed job/$job" || true
      done
    - echo "Limpeza de staging concluída."
  after_script:
    - rm -f /tmp/kubeconfig

cleanup:k8s:production:
  image:
    name: alpine/k8s:1.36.2
    entrypoint: [""]
  stage: cleanup
  interruptible: false
  needs:
    - job: deploy:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  before_script:
    - printf '%s' "$KUBECONFIG_CONTENT" | tr -d '\n\r ' | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - echo "=== Limpeza de Jobs em axiom ==="
    # Jobs concluídos (succeeded >= 1)
    - |
      DONE=$(kubectl get jobs -n axiom \
        -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.status.succeeded}{"\n"}{end}' \
        | awk -F= '$2 >= 1 {print $1}')
      for job in $DONE; do
        kubectl delete job -n axiom "$job" --ignore-not-found=true \
          && echo "  deleted completed job/$job" || true
      done
    # Jobs falhados e inativos
    - |
      FAILED=$(kubectl get jobs -n axiom \
        -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.status.failed}{"/"}{.status.active}{"\n"}{end}' \
        | awk -F'[=/]' '$2 >= 1 && $3 == 0 {print $1}')
      for job in $FAILED; do
        kubectl delete job -n axiom "$job" --ignore-not-found=true \
          && echo "  deleted failed job/$job" || true
      done
    - echo "Limpeza de produção concluída."
  after_script:
    - rm -f /tmp/kubeconfig

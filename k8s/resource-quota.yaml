---
# Namespace-level ResourceQuota caps total resource consumption in production,
# preventing a single misbehaving workload from starving the others.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mindledger-quota
  namespace: mindledger
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: resource-quota
spec:
  hard:
    # CPU: sum of all pod requests/limits across the namespace
    requests.cpu: "4"
    limits.cpu: "8"
    # Memory: sum of all pod requests/limits
    requests.memory: 4Gi
    limits.memory: 8Gi
    # Workload count caps
    pods: "20"
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
# LimitRange sets default requests/limits for containers that do not declare
# their own, and enforces a minimum/maximum per container.
apiVersion: v1
kind: LimitRange
metadata:
  name: mindledger-limit-range
  namespace: mindledger
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: resource-quota
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "50m"
        memory: "32Mi"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mindledger-staging
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: api
    environment: staging
spec:
  replicas: 1
  progressDeadlineSeconds: 480
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: mindledger
        app.kubernetes.io/component: api
        environment: staging
    spec:
      serviceAccountName: sa-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry-secret
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-service 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: api
          # Image tag is pinned to the build digest on every deploy by CI/CD.
          # See deploy:staging job in .gitlab-ci.yml.
          image: registry.gitlab.com/tarcisioribeiro/mindledger/api:0.0.0
          ports:
            - containerPort: 39100
              name: http
          envFrom:
            - configMapRef:
                name: mindledger-config
            - secretRef:
                name: mindledger-secrets
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: logs
              mountPath: /app/logs
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: minio-ca
              mountPath: /etc/ssl/minio/ca.crt
              subPath: ca.crt
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready/
              port: 39100
              httpHeaders:
                - name: Host
                  value: api-service
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live/
              port: 39100
              httpHeaders:
                - name: Host
                  value: api-service
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: api-media-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: api-logs-pvc
        - name: staticfiles
          persistentVolumeClaim:
            claimName: api-static-pvc
        - name: minio-ca
          secret:
            secretName: minio-tls
            items:
              - key: ca.crt
                path: ca.crt

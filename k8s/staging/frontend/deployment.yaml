apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mindledger-staging
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: frontend
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: mindledger
        app.kubernetes.io/component: frontend
        environment: staging
    spec:
      serviceAccountName: sa-frontend
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: frontend
          # Image tag is pinned to the build digest on every deploy by CI/CD.
          # See deploy:staging job in .gitlab-ci.yml.
          image: registry.gitlab.com/tarcisioribeiro/mindledger/frontend:0.0.0
          ports:
            - containerPort: 80
              name: http
          env:
            - name: TZ
              value: "America/Sao_Paulo"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

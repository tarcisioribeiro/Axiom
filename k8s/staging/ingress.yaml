# nginx-ingress Controller — Staging
# -------------------------------------------------------
# Prerequisites (run once on the VPS):
#
#   # Install nginx-ingress (k3s comes with Traefik — we replace it with nginx-ingress)
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.0/deploy/static/provider/cloud/deploy.yaml
#
#   # Install cert-manager (for TLS certificates via Let's Encrypt)
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#
# Note: The ClusterIssuers (letsencrypt-staging / letsencrypt-prod) are cluster-scoped
# and are already defined in k8s/ingress.yaml (production). You only need to apply them once.
# If they already exist, skip applying the ClusterIssuer sections there.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindledger-staging-ingress
  namespace: mindledger-staging
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: ingress
    environment: staging
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mindledger-staging.tjtux.duckdns.org
      secretName: mindledger-staging-tls
  rules:
    - host: mindledger-staging.tjtux.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8002
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8002
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8002
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8002
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8002
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8002
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8002
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

# Ingress — Staging
# -------------------------------------------------------
# k3s ships with Traefik as the default ingress controller, so this Ingress
# intentionally omits `ingressClassName` to let whatever controller is set as
# the cluster default handle the rules. On a plain k3s VPS that means Traefik;
# if nginx-ingress is later installed and marked as default, it will take over
# automatically.
#
# nginx-ingress annotations are kept as comments for reference but are not
# applied (Traefik ignores unknown annotation namespaces).
#
# Prerequisites (run once on the VPS):
#
#   # Install cert-manager (for TLS certificates via Let's Encrypt)
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#
# Note: The ClusterIssuers (letsencrypt-staging / letsencrypt-prod) are cluster-scoped
# and are already defined in k8s/ingress.yaml (production). You only need to apply them once.
# If they already exist, skip applying the ClusterIssuer sections there.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindledger-staging-ingress
  namespace: mindledger-staging
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: ingress
    environment: staging
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Traefik (k3s default) — disable HTTPS redirect so HTTP works during cert provisioning
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    # nginx-ingress equivalents (ignored by Traefik, active if nginx-ingress is the controller):
    # nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  tls:
    - hosts:
        - mindledger-staging.tjtux.duckdns.org
      secretName: mindledger-staging-tls
  rules:
    - host: mindledger-staging.tjtux.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

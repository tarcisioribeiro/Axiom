---
# Least-privilege ServiceAccounts for each MindLedger staging workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-api
  namespace: mindledger-staging
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: api
    environment: staging
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-frontend
  namespace: mindledger-staging
  labels:
    app.kubernetes.io/name: mindledger

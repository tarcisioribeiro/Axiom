apiVersion: v1
kind: ConfigMap
metadata:
  name: mindledger-config
  namespace: mindledger-staging
  labels:
    app.kubernetes.io/name: mindledger
    app.kubernetes.io/component: config
    environment: staging
data:
  # Database connection (own staging instance)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"

  # API settings
  API_PORT: "39100"
  DEBUG: "True"

  ALLOWED_HOSTS: "localhost,127.0.0.1,api-service,mindledger-staging.tjtux.duckdns.org"
  CORS_ALLOWED_ORIGINS: "http://localhost:39101,https://mindledger-staging.tjtux.duckdns.org"

  # MinIO object storage (own staging instance)
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_EXTERNAL_ENDPOINT: "mindledger-staging.tjtux.duckdns.org:9000"
  MINIO_BUCKET_NAME: "mindledger-staging"
  MINIO_USE_SSL: "true"
  MINIO_CA_BUNDLE: "/etc/ssl/minio/ca.crt"

  # Ollama — disabled in staging (too heavy for shared VPS)
  OLLAMA_HOST: ""

  # Sentry environment tag
  SENTRY_ENVIRONMENT: "staging"

  # Staging: SSL redirect off (Ingress handles TLS termination)
  SECURE_SSL_REDIRECT: "False"
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  SECURE_HSTS_SECONDS: "0"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"

  # Django settings
  PYTHONUNBUFFERED: "1"
  DJANGO_SETTINGS_MODULE: "app.settings"
  LOG_FORMAT: "json"
  TZ: "America/Sao_Paulo"

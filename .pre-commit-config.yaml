repos:
  # Secret detection — must run before everything else
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # Python formatting — config in apps/api/pyproject.toml [tool.black]
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^apps/api/
        exclude: ^apps/api/.*/migrations/
        args: [--config, apps/api/pyproject.toml]

  # Import sorting — config in apps/api/pyproject.toml [tool.isort]
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^apps/api/
        exclude: ^apps/api/.*/migrations/
        args: [--settings-path, apps/api/]

  # Linting — config in apps/api/.flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^apps/api/
        exclude: ^apps/api/.*/migrations/
        args: ["--config=apps/api/.flake8"]

  # Type checking — runs in an isolated pre-commit virtualenv so no host-level
  # pip install is required.  The versions below must stay in sync with
  # apps/api/requirements-dev.txt and apps/api/requirements.txt.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: python
        entry: bash -c 'cd apps/api && python -m mypy --config-file pyproject.toml .'
        pass_filenames: false
        files: ^apps/api/
        exclude: ^apps/api/.*/migrations/
        additional_dependencies:
          - mypy==1.19.1
          - django-stubs==5.2.9
          - djangorestframework-stubs==3.16.8
          - Django==5.2.14
          - djangorestframework==3.16.1
          - cryptography==46.0.7
          - python-dotenv==1.2.2
          - rapidfuzz==3.14.3
          - pgvector==0.3.3
          - psycopg2-binary==2.9.10
          - pyotp==2.9.0
          - qrcode==8.0
          - celery==5.5.3
          - django-celery-beat==2.8.1

  # Commit message linting
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        language: node
        entry: commitlint --edit --config apps/frontend/commitlint.config.cjs
        pass_filenames: false
        additional_dependencies:
          - '@commitlint/cli@19'
          - '@commitlint/config-conventional@19'
        stages: [commit-msg]

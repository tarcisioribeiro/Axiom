# =============================================================================
# Axiom — Kustomize staging overlay
# =============================================================================
# Patches base/ down to the staging footprint: smaller resource requests/
# limits and storage, no MinIO TLS, NodePort MinIO instead of ClusterIP,
# staging-only ConfigMap values, and the single-Deployment (non-blue-green)
# API. See each file under patches/ for the specific delta it captures.
#
# CI deploy command (see .gitlab-ci.yml deploy:staging):
#   kubectl apply -k infra/k8s/overlays/staging
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: axiom-staging

labels:
  - pairs:
      environment: staging
    includeSelectors: false

resources:
  - ../../base
  - api/deployment.yaml
  - api/service.yaml

patches:
  - path: patches/configmap.yaml
  - path: patches/redis-deployment.yaml
  - path: patches/redis-pvc.yaml
  - path: patches/ollama-deployment.yaml
  - path: patches/ollama-pvc.yaml
  - path: patches/frontend.yaml
  - path: patches/frontend-remove-hostaliases.json
    target:
      kind: Deployment
      name: frontend
  - path: patches/minio-deployment.json
    target:
      kind: Deployment
      name: minio
  - path: patches/minio-job.yaml
  - path: patches/minio-service.yaml
  - path: patches/minio-pvc.yaml
  - path: patches/minio-tls.yaml
  - path: patches/api-logs-pvc.yaml
  - path: patches/api-static-pvc.yaml
  - path: patches/api-service.json
    target:
      kind: Service
      name: api-service
  - path: patches/serviceaccounts.yaml
  - path: patches/resource-quota.yaml
  - path: patches/limit-range.yaml
  - path: patches/ingress.json
    target:
      kind: Ingress
      name: axiom-ingress
  - path: patches/network-policy-remove-prometheus.yaml
  - path: patches/network-policy-remove-acme-solver.yaml
  - path: patches/network-policy-backup.json
    target:
      kind: NetworkPolicy
      name: allow-api-to-minio

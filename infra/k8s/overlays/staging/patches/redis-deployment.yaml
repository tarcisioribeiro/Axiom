apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: axiom
spec:
  template:
    spec:
      containers:
        - name: redis
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "128mb"
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(REDIS_PASSWORD)
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: axiom
spec:
  template:
    spec:
      containers:
        - name: mc
          command:
            - sh
            - -c
            - |
              mc alias set myminio http://minio-service:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing myminio/axiom-staging
              echo "Bucket axiom-staging created (or already exists)"

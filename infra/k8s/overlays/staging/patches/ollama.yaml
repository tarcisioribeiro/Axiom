apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: axiom
spec:
  progressDeadlineSeconds: 660
  template:
    spec:
      containers:
        - name: ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: axiom
spec:
  resources:
    requests:
      storage: 15Gi

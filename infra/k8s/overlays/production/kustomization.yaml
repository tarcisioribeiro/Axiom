# =============================================================================
# Axiom — Kustomize production overlay
# =============================================================================
# Base already reflects the production footprint (see base/kustomization.yaml),
# so this overlay adds no patches — it only sets the namespace and pulls in
# the API blue-green Deployments, which are production-only and never shared
# with staging's single Recreate Deployment.
#
# CI deploy command (see .gitlab-ci.yml deploy:production):
#   kubectl apply -k infra/k8s/overlays/production
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: axiom

resources:
  - ../../base
  - api/deployment-blue.yaml
  - api/deployment-green.yaml

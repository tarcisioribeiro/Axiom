# =============================================================================
# Axiom — Automated Database Backup
# =============================================================================
#
# Resources defined in this file (apply order matters):
#   1. backup-pvc              PVC for local backup staging (~5 Gi)
#   2. backup-script           ConfigMap embedding api/scripts/backup.sh
#   3. axiom-db-backup    CronJob — daily at 02:00 BRT
#
# ─────────────────────────────────────────────────────────────────────────────
# Prerequisites
# ─────────────────────────────────────────────────────────────────────────────
#
#   The Secret "axiom-backup-secrets" must exist before applying.
#   It is defined in infra/k8s/base/secrets.yaml and requires these variables:
#
#     BACKUP_ENCRYPTION_KEY  Random 32+ char passphrase for AES-256 encryption.
#                            NEVER change this after encrypting data — older
#                            backups will become unrecoverable.
#     MINIO_ENDPOINT         external MinIO host, e.g. https://minio.example.com
#     MINIO_ACCESS_KEY       MinIO / S3 access key
#     MINIO_SECRET_KEY       MinIO / S3 secret key
#
# ─────────────────────────────────────────────────────────────────────────────
# RPO / RTO Targets
# ─────────────────────────────────────────────────────────────────────────────
#
#   RPO (Recovery Point Objective): 24 hours
#     Backups run daily at 02:00 BRT. Worst-case data loss is one day.
#
#   RTO (Recovery Time Objective): ≤ 4 hours
#     • Download encrypted archive from MinIO          ~  5 min
#     • Decrypt + decompress with openssl/gunzip       ~  5 min
#     • Provision / restart Kubernetes infrastructure ~ 30 min
#     • psql restore (size-dependent; typically)       ~ 30–120 min
#     • Smoke-tests and service cutover               ~ 15 min
#
# ─────────────────────────────────────────────────────────────────────────────
# Keeping the script in sync
# ─────────────────────────────────────────────────────────────────────────────
#
#   The canonical source is api/scripts/backup.sh.
#   After editing that file, regenerate the ConfigMap section with:
#
#     kubectl create configmap backup-script \
#       --from-file=backup.sh=api/scripts/backup.sh \
#       --dry-run=client -o yaml -n axiom
#
#   Then replace the data.backup\.sh field below with the new output.
#
# ─────────────────────────────────────────────────────────────────────────────
# Apply
# ─────────────────────────────────────────────────────────────────────────────
#
#   kubectl apply -f infra/k8s/overlays/production/backup-cronjob.yaml
#
#   Trigger a manual run:
#     kubectl create job --from=cronjob/axiom-db-backup axiom-backup-manual -n axiom
#
#   Watch logs:
#     kubectl logs -f -l app=axiom-backup -n axiom
#
# =============================================================================

---
# ── 1. PVC — local staging volume ─────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: axiom
  labels:
    app.kubernetes.io/name: axiom
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# ── 2. ConfigMap — backup script ──────────────────────────────────────────────
# Source of truth: api/scripts/backup.sh
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
  namespace: axiom
  labels:
    app.kubernetes.io/name: axiom
    app.kubernetes.io/component: backup
data:
  backup.sh: |
    #!/bin/bash
    # =============================================================================
    # Axiom Database Backup Script
    # =============================================================================
    #
    # Runs inside the Docker Compose db-backup container (see docker/backup/) or a
    # Kubernetes CronJob pod (see k8s/backup-cronjob.yaml).  Connects to PostgreSQL
    # via the cluster/network-internal service hostname set in PGHOST.
    #
    # ─────────────────────────────────────────────────────────────────────────────
    # RPO / RTO Targets
    # ─────────────────────────────────────────────────────────────────────────────
    #
    #   RPO (Recovery Point Objective): 24 hours
    #     Backups run daily at 02:00 BRT (configurable via BACKUP_CRON).
    #     In the worst case, up to 24 h of changes may be lost after a failure.
    #
    #   RTO (Recovery Time Objective): ≤ 4 hours
    #     Breakdown:
    #       • Download encrypted backup from MinIO          ~  5 min
    #       • Decrypt with openssl                          ~  5 min
    #       • Provision / restart infrastructure            ~ 30 min
    #       • psql restore (depends on DB size; typically)  ~ 30–120 min
    #       • Smoke-tests and service cutover               ~ 15 min
    #
    # ─────────────────────────────────────────────────────────────────────────────
    # Restore Procedure
    # ─────────────────────────────────────────────────────────────────────────────
    #
    #   1. Download the encrypted archive from MinIO:
    #        mc cp axiom-storage/axiom-backups/db/db_backup_<TS>_kv<VER>.sql.gz.enc .
    #
    #   2. Decrypt (use the key that matches the _kv<VER> suffix in the filename;
    #      store historical keys as BACKUP_ENCRYPTION_KEY_v1, _v2, etc.):
    #        export BACKUP_ENCRYPTION_KEY="<key-for-that-version>"
    #        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
    #          -pass env:BACKUP_ENCRYPTION_KEY \
    #          -in  db_backup_<TS>_kv<VER>.sql.gz.enc \
    #          -out db_backup_<TS>_kv<VER>.sql.gz
    #
    #   3. Decompress:
    #        gunzip db_backup_<TS>_kv<VER>.sql.gz
    #
    #   4. Restore (plain SQL — no pg_restore needed):
    #        psql \
    #          -h <PGHOST> -p <PGPORT> -U <DB_USER> -d <DB_NAME> \
    #          -f db_backup_<TS>_kv<VER>.sql
    #
    # ─────────────────────────────────────────────────────────────────────────────
    # Required Environment Variables
    # ─────────────────────────────────────────────────────────────────────────────
    #   PGPASSWORD            PostgreSQL password
    #   BACKUP_ENCRYPTION_KEY AES-256 passphrase for new backups (keep secret;
    #                         rotate via rekey-backups.sh — see Key Rotation below)
    #   MINIO_ENDPOINT        MinIO/S3 endpoint. Accepts either a bare host:port
    #                         (e.g. minio:9000 — scheme added from MINIO_USE_SSL
    #                         below, same convention as apps/api/app/settings.py)
    #                         or a full URL with scheme (e.g. http://minio:9000).
    #   MINIO_ACCESS_KEY      MinIO/S3 access key
    #   MINIO_SECRET_KEY      MinIO/S3 secret key
    #
    # Optional Environment Variables
    # ─────────────────────────────────────────────────────────────────────────────
    #   PGHOST               (default: db)
    #   PGPORT               (default: 5432)
    #   DB_NAME              (default: axiom_db)
    #   DB_USER              (default: postgres)
    #   BACKUP_DIR           (default: /backups)
    #   MINIO_BUCKET         (default: axiom-backups)
    #   MINIO_USE_SSL         (default: false) — scheme used when MINIO_ENDPOINT
    #                         has none: "true" -> https://, else http://
    #   KEEP_DAILY           (default: 7)   — daily backups to keep locally
    #   KEEP_WEEKLY          (default: 4)   — one-per-week backups to keep locally
    #   KEEP_MONTHLY         (default: 3)   — one-per-month backups to keep locally
    #   MC_BIN               (default: /usr/local/bin/mc)
    #   BACKUP_KEY_VERSION   (default: v1)  — version label embedded in filename;
    #                        increment (v2, v3, …) when rotating the key
    #
    # ─────────────────────────────────────────────────────────────────────────────
    # Key Rotation
    # ─────────────────────────────────────────────────────────────────────────────
    #
    #   Backup filenames include the key version (e.g. _kv1) so that the correct
    #   decryption key can always be identified.  To rotate:
    #
    #   1. Generate a new passphrase and set it as BACKUP_ENCRYPTION_KEY in .env.
    #   2. Increment BACKUP_KEY_VERSION (e.g. v1 → v2) in .env.
    #   3. Store the OLD key as BACKUP_ENCRYPTION_KEY_v1 in .env (for decryption
    #      of historical backups and for rekey-backups.sh).
    #   4. Restart the db-backup container so it picks up the new env vars.
    #   5. Optionally re-encrypt existing backups:
    #        BACKUP_ENCRYPTION_KEY_v1=<old> BACKUP_ENCRYPTION_KEY=<new> \
    #          /scripts/rekey-backups.sh --from-version v1 --to-version v2
    # =============================================================================

    set -euo pipefail

    # ── Configuration ──────────────────────────────────────────────────────────────
    BACKUP_DIR="${BACKUP_DIR:-/backups}"
    DATE=$(date +%Y%m%d_%H%M%S)
    DB_NAME="${DB_NAME:-axiom_db}"
    DB_USER="${DB_USER:-postgres}"
    PGHOST="${PGHOST:-db}"
    PGPORT="${PGPORT:-5432}"
    MINIO_BUCKET="${MINIO_BUCKET:-axiom-backups}"
    MC_BIN="${MC_BIN:-/usr/local/bin/mc}"
    BACKUP_KEY_VERSION="${BACKUP_KEY_VERSION:-v1}"
    MINIO_USE_SSL="${MINIO_USE_SSL:-false}"

    # GFS (Grandfather-Father-Son) retention policy
    KEEP_DAILY="${KEEP_DAILY:-7}"
    KEEP_WEEKLY="${KEEP_WEEKLY:-4}"
    KEEP_MONTHLY="${KEEP_MONTHLY:-3}"

    export PGHOST PGPORT PGPASSWORD

    # ── Fail-fast on missing required variables ────────────────────────────────────
    : "${PGPASSWORD:?PGPASSWORD is required}"
    : "${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY is required}"
    : "${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}"
    : "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
    : "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"

    # mc (MinIO client) requires a full URL with scheme, but MINIO_ENDPOINT is
    # conventionally passed as a bare host:port across this codebase (see
    # apps/api/app/settings.py, which builds AWS_S3_ENDPOINT_URL the same way) —
    # normalize it here instead of assuming callers already include the scheme.
    if [[ "$MINIO_ENDPOINT" != http://* && "$MINIO_ENDPOINT" != https://* ]]; then
        if [[ "$MINIO_USE_SSL" == "true" ]]; then
            MINIO_ENDPOINT="https://${MINIO_ENDPOINT}"
        else
            MINIO_ENDPOINT="http://${MINIO_ENDPOINT}"
        fi
    fi

    # ── Logging ────────────────────────────────────────────────────────────────────
    GREEN='\033[0;32m'
    RED='\033[0;31m'
    YELLOW='\033[1;33m'
    NC='\033[0m'

    log()     { echo -e "${GREEN}[$(date '+%Y-%m-%d %H:%M:%S')]${NC} $*"; }
    error()   { echo -e "${RED}[$(date '+%Y-%m-%d %H:%M:%S')] ERROR:${NC} $*" >&2; }
    warning() { echo -e "${YELLOW}[$(date '+%Y-%m-%d %H:%M:%S')] WARNING:${NC} $*"; }

    # ── File paths ─────────────────────────────────────────────────────────────────
    mkdir -p "$BACKUP_DIR"

    DB_SQL="$BACKUP_DIR/db_backup_${DATE}_kv${BACKUP_KEY_VERSION}.sql"
    DB_GZ="$BACKUP_DIR/db_backup_${DATE}_kv${BACKUP_KEY_VERSION}.sql.gz"
    DB_ENC="$BACKUP_DIR/db_backup_${DATE}_kv${BACKUP_KEY_VERSION}.sql.gz.enc"
    SENTINEL_FILE="$BACKUP_DIR/.last_successful_backup"
    STATUS_FILE="$BACKUP_DIR/.last_backup_status"

    log "════════════════════════════════════════════════════════════"
    log "Axiom Backup — $(date '+%Y-%m-%d %H:%M:%S %Z')"
    log "  Database  : ${DB_NAME}@${PGHOST}:${PGPORT}"
    log "  Bucket    : ${MINIO_ENDPOINT}/${MINIO_BUCKET}/db/"
    log "  Retention : ${KEEP_DAILY}d / ${KEEP_WEEKLY}w / ${KEEP_MONTHLY}m"
    log "════════════════════════════════════════════════════════════"

    # Mark the backup as in-progress so monitoring can detect hung jobs
    echo "in_progress:${DATE}" > "$STATUS_FILE"

    # ─────────────────────────────────────────────────────────────────────────────
    # Step 1: Database dump — plain SQL
    #
    # --no-owner/--no-acl keep the dump portable across environments where the
    # restoring role differs from the one that created the objects (matches the
    # convention already used by infra/scripts/k8s-backup.sh).
    # ─────────────────────────────────────────────────────────────────────────────
    log "Step 1/6 — Creating database dump (plain SQL)..."

    pg_dump \
        --host="$PGHOST" \
        --port="$PGPORT" \
        --username="$DB_USER" \
        --dbname="$DB_NAME" \
        --format=plain \
        --no-owner \
        --no-acl \
        --no-password \
        --file="$DB_SQL"

    DUMP_SIZE=$(du -h "$DB_SQL" | cut -f1)
    log "Dump created: $(basename "$DB_SQL") (${DUMP_SIZE})"

    # ─────────────────────────────────────────────────────────────────────────────
    # Step 2: Integrity verification
    #
    # Plain-format dumps have no table-of-contents to inspect (that's a
    # pg_restore/custom-format-only feature), so integrity is checked instead via
    # the "-- PostgreSQL database dump complete" trailer pg_dump appends once it
    # finishes writing without error; its absence signals a truncated file (e.g.
    # the process was killed mid-dump).
    # ─────────────────────────────────────────────────────────────────────────────
    log "Step 2/6 — Verifying backup integrity..."

    if [ ! -s "$DB_SQL" ] || ! tail -n 5 "$DB_SQL" | grep -q "PostgreSQL database dump complete"; then
        error "Dump file is empty or missing its completion trailer — dump may be truncated"
        rm -f "$DB_SQL"
        echo "failed:integrity_check:${DATE}" > "$STATUS_FILE"
        exit 1
    fi
    log "Integrity check passed — completion trailer found"

    # ─────────────────────────────────────────────────────────────────────────────
    # Step 3: Compression — gzip
    # ─────────────────────────────────────────────────────────────────────────────
    log "Step 3/6 — Compressing dump (gzip -9)..."

    gzip -9 "$DB_SQL"

    GZ_SIZE=$(du -h "$DB_GZ" | cut -f1)
    log "Compressed: $(basename "$DB_GZ") (${GZ_SIZE})"

    # ─────────────────────────────────────────────────────────────────────────────
    # Step 4: AES-256-CBC encryption — this is what password-protects the .gz
    #
    # • PBKDF2 key derivation with 600 000 iterations (NIST SP 800-132 guidance)
    # • Random salt prepended to ciphertext (required for decryption)
    # • Key read via -pass env:VAR — not visible in /proc/<pid>/cmdline or ps
    # ─────────────────────────────────────────────────────────────────────────────
    log "Step 4/6 — Encrypting backup (AES-256-CBC, PBKDF2, 600k iterations, key version: ${BACKUP_KEY_VERSION})..."

    openssl enc -aes-256-cbc \
        -pbkdf2 \
        -iter 600000 \
        -salt \
        -pass "env:BACKUP_ENCRYPTION_KEY" \
        -in  "$DB_GZ" \
        -out "$DB_ENC"

    ENC_SIZE=$(du -h "$DB_ENC" | cut -f1)
    log "Encrypted: $(basename "$DB_ENC") (${ENC_SIZE})"

    # Remove the unencrypted .gz immediately after encryption
    rm -f "$DB_GZ"
    log "Unencrypted archive removed"

    # ─────────────────────────────────────────────────────────────────────────────
    # Step 5: Upload to MinIO — mandatory
    # ─────────────────────────────────────────────────────────────────────────────
    log "Step 5/6 — Uploading to MinIO (${MINIO_ENDPOINT})..."

    # Configure mc alias (stdout/stderr captured, not shown, to avoid leaking
    # credentials — but checked, so a bad endpoint/credential fails fast here
    # instead of surfacing as a confusing "mc cp" failure two steps later).
    if ! MC_ALIAS_OUTPUT=$("$MC_BIN" alias set axiom-storage \
        "$MINIO_ENDPOINT" \
        "$MINIO_ACCESS_KEY" \
        "$MINIO_SECRET_KEY" \
        --api S3v4 2>&1); then
        error "Failed to configure mc alias for ${MINIO_ENDPOINT} — check MINIO_ENDPOINT/MINIO_USE_SSL"
        error "$MC_ALIAS_OUTPUT"
        echo "failed:minio_alias:${DATE}" > "$STATUS_FILE"
        exit 1
    fi

    # Ensure bucket exists (idempotent)
    "$MC_BIN" mb --ignore-existing "axiom-storage/${MINIO_BUCKET}" > /dev/null 2>&1 || true

    # Upload encrypted archive — failure is fatal
    if ! "$MC_BIN" cp "$DB_ENC" "axiom-storage/${MINIO_BUCKET}/db/"; then
        error "Failed to upload encrypted archive to MinIO — backup not stored off-site"
        echo "failed:minio_upload:${DATE}" > "$STATUS_FILE"
        exit 1
    fi
    log "Encrypted archive uploaded"

    # ─────────────────────────────────────────────────────────────────────────────
    # Optional: Media files backup
    #
    # Only runs when /app/media is mounted and non-empty.
    # ─────────────────────────────────────────────────────────────────────────────
    MEDIA_ARCHIVE="$BACKUP_DIR/media_backup_${DATE}.tar.gz"

    if [ -d "/app/media" ] && [ "$(ls -A /app/media 2>/dev/null)" ]; then
        log "Media backup — archiving /app/media..."
        if tar -czf "$MEDIA_ARCHIVE" -C /app media/ 2>/dev/null; then
            MEDIA_SIZE=$(du -h "$MEDIA_ARCHIVE" | cut -f1)
            log "Media archive created: $(basename "$MEDIA_ARCHIVE") (${MEDIA_SIZE})"
            if "$MC_BIN" cp "$MEDIA_ARCHIVE" "axiom-storage/${MINIO_BUCKET}/media/" > /dev/null 2>&1; then
                log "Media archive uploaded to MinIO"
            else
                warning "Media archive upload failed (non-critical)"
            fi
        else
            warning "Failed to create media archive (non-critical)"
        fi
    else
        log "No media files found — skipping media backup"
    fi

    # ─────────────────────────────────────────────────────────────────────────────
    # Step 6: Local retention — GFS (Grandfather-Father-Son) policy
    #
    # Files are named db_backup_YYYYMMDD_HHMMSS.sql.gz.enc; the date is parsed
    # directly from the filename (more reliable than mtime under copy/move).
    #
    # Keep:
    #   • The ${KEEP_DAILY} most recent backups (daily)
    #   • One backup per ISO week for the last ${KEEP_WEEKLY} distinct weeks
    #   • One backup per calendar month for the last ${KEEP_MONTHLY} months
    #
    # A file can satisfy multiple criteria; it is kept if it satisfies any one.
    # ─────────────────────────────────────────────────────────────────────────────
    log "Step 6/6 — Applying GFS retention (${KEEP_DAILY}d / ${KEEP_WEEKLY}w / ${KEEP_MONTHLY}m)..."

    prune_local_backups() {
        # Collect all encrypted archives, sorted newest-first by filename timestamp.
        local -a all_files=()
        while IFS= read -r -d '' f; do
            all_files+=("$f")
        done < <(find "$BACKUP_DIR" -maxdepth 1 -name 'db_backup_*.sql.gz.enc' -print0 \
                 | sort -rz)

        local total=${#all_files[@]}
        if (( total == 0 )); then
            log "No local encrypted archives found — nothing to prune"
            return
        fi

        # Mark files to keep.
        local -a keep=()
        local -A seen_weeks=()
        local -A seen_months=()
        local daily_count=0

        for f in "${all_files[@]}"; do
            local base date_str year month day week ym keep_this
            base=$(basename "$f")

            # Parse YYYYMMDD from: db_backup_YYYYMMDD_HHMMSS.sql.gz.enc
            date_str="${base#db_backup_}"   # YYYYMMDD_HHMMSS.sql.gz.enc
            date_str="${date_str%%_*}"      # YYYYMMDD (stop at first underscore after date)
            # Handle edge case: if stripping only produced length-8 string
            if [[ ${#date_str} -ne 8 ]] || ! [[ $date_str =~ ^[0-9]{8}$ ]]; then
                warning "Skipping unrecognised filename: $base"
                keep+=("$f")
                continue
            fi

            year="${date_str:0:4}"
            month="${date_str:4:2}"
            day="${date_str:6:2}"

            # ISO year-week (GNU date); fall back to calendar month on failure.
            week=$(date -d "${year}-${month}-${day}" +%G-%V 2>/dev/null) \
                || week="${year}-${month}"
            ym="${year}-${month}"

            keep_this=false

            if (( daily_count < KEEP_DAILY )); then
                keep_this=true
                (( daily_count++ )) || true
            elif [[ -z "${seen_weeks[$week]+x}" ]] \
                 && (( ${#seen_weeks[@]} < KEEP_WEEKLY )); then
                keep_this=true
                seen_weeks["$week"]=1
            elif [[ -z "${seen_months[$ym]+x}" ]] \
                 && (( ${#seen_months[@]} < KEEP_MONTHLY )); then
                keep_this=true
                seen_months["$ym"]=1
            fi

            if $keep_this; then
                keep+=("$f")
            fi
        done

        # Delete files not in the keep list.
        local deleted=0
        for f in "${all_files[@]}"; do
            local in_keep=false
            local k
            for k in "${keep[@]}"; do
                [[ "$k" == "$f" ]] && { in_keep=true; break; }
            done
            if ! $in_keep; then
                rm -f "$f"
                (( deleted++ )) || true
                log "Pruned: $(basename "$f")"
            fi
        done

        log "Retention: kept ${#keep[@]} / ${total} local dumps (deleted ${deleted})"
    }

    prune_local_backups

    # Also clean up local media archives older than (KEEP_DAILY + KEEP_WEEKLY*7 + KEEP_MONTHLY*31) days
    MEDIA_MAX_AGE=$(( KEEP_DAILY + KEEP_WEEKLY * 7 + KEEP_MONTHLY * 31 ))
    find "$BACKUP_DIR" -maxdepth 1 -name "media_backup_*.tar.gz" \
        -mtime "+${MEDIA_MAX_AGE}" -delete 2>/dev/null || true

    # ─────────────────────────────────────────────────────────────────────────────
    # Monitoring sentinel — written only on full success
    #
    # check_backup_health Django management command reads these files.
    # ─────────────────────────────────────────────────────────────────────────────
    UNIX_TS=$(date +%s)
    echo "$UNIX_TS" > "$SENTINEL_FILE"
    echo "success:${DATE}" > "$STATUS_FILE"
    log "Monitoring sentinel updated: $SENTINEL_FILE"

    # ─────────────────────────────────────────────────────────────────────────────
    # Summary
    # ─────────────────────────────────────────────────────────────────────────────
    TOTAL_LOCAL=$(du -sh "$BACKUP_DIR" 2>/dev/null | cut -f1 || echo "N/A")
    log "════════════════════════════════════════════════════════════"
    log "Backup completed successfully at $(date '+%Y-%m-%d %H:%M:%S %Z')"
    log "  Encrypted archive : $(basename "$DB_ENC")"
    log "  Remote path       : ${MINIO_ENDPOINT}/${MINIO_BUCKET}/db/"
    log "  Local dir size    : ${TOTAL_LOCAL}"
    log "  Timestamp         : ${DATE}"
    log "  Key version       : ${BACKUP_KEY_VERSION}"
    log "════════════════════════════════════════════════════════════"
---
# ── 3. CronJob — daily at 02:00 BRT ───────────────────────────────────────────
#
# initContainer  minio/mc:latest  copies the mc binary into the shared
#                                 emptyDir volume /tools so the main
#                                 container (postgres:16) can use it.
#
# main container postgres:16      has pg_dump, psql, gzip and openssl
#                                 built in; runs the backup script.
#
# Note on api-media-pvc: it is ReadWriteOnce. To enable media backup,
# the backup pod must be scheduled on the same node as the API pod,
# or the PVC must be migrated to ReadWriteMany. The script skips the
# media step gracefully when /app/media is absent.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axiom-db-backup
  namespace: axiom
  labels:
    app.kubernetes.io/name: axiom
    app.kubernetes.io/component: backup
spec:
  # 02:00 BRT daily (BRT = UTC-3, requires Kubernetes ≥ 1.27 for timeZone)
  schedule: "0 2 * * *"
  timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Fail the job if it runs longer than 1 hour
      activeDeadlineSeconds: 3600
      # Retry once before marking the job as failed
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: axiom-backup
            app.kubernetes.io/name: axiom
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: sa-backup
          automountServiceAccountToken: false

          # ── initContainer: supply the mc binary ─────────────────────────────
          initContainers:
            - name: install-mc
              image: minio/mc:RELEASE.2024-11-21T17-21-54Z
              command: ["cp", "/usr/bin/mc", "/tools/mc"]
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
              volumeMounts:
                - name: tools
                  mountPath: /tools

          # ── main container: run the backup script ───────────────────────────
          containers:
            - name: backup
              image: postgres:16
              command: ["/bin/bash", "/scripts/backup.sh"]
              env:
                # PostgreSQL connection — self-managed, same VPS as k3s. Host/port
                # come from axiom-secrets (injected from CI/CD variables), same as
                # the API deployments' wait-for-postgres init container.
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: axiom-secrets
                      key: DB_HOST
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: axiom-secrets
                      key: DB_PORT
                - name: PGSSLMODE
                  valueFrom:
                    configMapKeyRef:
                      name: axiom-config
                      key: DB_SSLMODE
                      optional: true
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: axiom-secrets
                      key: DB_NAME
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: axiom-secrets
                      key: DB_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: axiom-secrets
                      key: DB_PASSWORD

                # Backup encryption & off-site storage
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: axiom-backup-secrets
                      key: BACKUP_ENCRYPTION_KEY
                - name: MINIO_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: axiom-backup-secrets
                      key: MINIO_ENDPOINT
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: axiom-backup-secrets
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: axiom-backup-secrets
                      key: MINIO_SECRET_KEY

                # Tunable parameters
                - name: MINIO_BUCKET
                  value: "axiom-backups"
                # Matches axiom-config's MINIO_USE_SSL — MINIO_ENDPOINT is a
                # bare host:port (see axiom-secrets), so backup.sh needs this
                # to build the scheme itself for `mc alias set`.
                - name: MINIO_USE_SSL
                  value: "true"
                - name: BACKUP_DIR
                  value: "/backups"
                # Key version label embedded in backup filenames (_kv<VER>).
                # Bump when rotating BACKUP_ENCRYPTION_KEY — see apps/api/scripts/backup.sh
                # "Key Rotation" section and rekey-backups.sh.
                - name: BACKUP_KEY_VERSION
                  value: "v1"
                # Flat 7-day retention (no GFS weekly/monthly tiers — matches the
                # MinIO bucket lifecycle expiry rule, also 7 days).
                - name: KEEP_DAILY
                  value: "7"
                - name: KEEP_WEEKLY
                  value: "0"
                - name: KEEP_MONTHLY
                  value: "0"
                - name: MC_BIN
                  value: "/tools/mc"
                - name: TZ
                  value: "America/Sao_Paulo"

              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: backup-script
                  mountPath: /scripts
                - name: tools
                  mountPath: /tools

              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"

          # ── volumes ─────────────────────────────────────────────────────────
          volumes:
            # PVC for staging encrypted dumps before upload
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc

            # ConfigMap holds the backup.sh script (executable via defaultMode)
            - name: backup-script
              configMap:
                name: backup-script
                defaultMode: 0755

            # Shared volume for mc binary copied by the initContainer
            - name: tools
              emptyDir: {}

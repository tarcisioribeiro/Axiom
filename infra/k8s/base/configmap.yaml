apiVersion: v1
kind: ConfigMap
metadata:
  name: axiom-config
  namespace: axiom
  labels:
    app.kubernetes.io/name: axiom
    app.kubernetes.io/component: config
data:
  # Database connection — DB_HOST/DB_PORT are intentionally NOT set here.
  # PostgreSQL runs self-managed, outside the cluster, on the same VPS as k3s.
  # Host/port are injected into the axiom-secrets Secret at deploy time from
  # the STAGING_DB_HOST/STAGING_DB_PORT and PRODUCTION_DB_HOST/PRODUCTION_DB_PORT
  # CI/CD variables (see deploy:staging / deploy:production in .gitlab-ci.yml)
  # so the network topology is never committed to the repo.
  # "prefer" degrades gracefully since the local Postgres has no TLS cert configured.
  DB_SSLMODE: "prefer"

  # API settings
  API_PORT: "39100"
  DEBUG: "0"
  # Include the ingress hostname so Django accepts requests forwarded by nginx.
  ALLOWED_HOSTS: "localhost,127.0.0.1,api-service,axiom-api,axiom.tjtux.duckdns.org"
  # Include both http (local Kind dev) and https (production via ingress TLS).
  CORS_ALLOWED_ORIGINS: "http://localhost:39101,http://127.0.0.1:39101,http://frontend-service,https://axiom.tjtux.duckdns.org"

  # MinIO object storage — runs external to the cluster (see
  # documentation/storage/infrastructure.md). MINIO_ENDPOINT/
  # MINIO_EXTERNAL_ENDPOINT are intentionally NOT set here: they're injected
  # into the axiom-secrets Secret at deploy time from the
  # STAGING_MINIO_ENDPOINT/STAGING_MINIO_EXTERNAL_ENDPOINT and
  # PRODUCTION_MINIO_ENDPOINT/PRODUCTION_MINIO_EXTERNAL_ENDPOINT CI/CD
  # variables (see deploy:staging / deploy:production in .gitlab-ci.yml), so
  # the network topology is never committed to the repo. MinIO's TLS
  # certificate is publicly trusted (Let's Encrypt / reverse proxy), so no
  # custom CA bundle path is needed anymore.
  MINIO_BUCKET_NAME: "axiom"
  MINIO_USE_SSL: "true"

  # Ollama — self-hosted, externo ao cluster (ver
  # documentation/llm/infrastructure.md). OLLAMA_BASE_URL é intencionalmente
  # NÃO definido aqui: é injetado no Secret axiom-secrets no deploy a partir
  # das variáveis de CI/CD STAGING_OLLAMA_BASE_URL/PRODUCTION_OLLAMA_BASE_URL
  # (ver deploy:staging / deploy:production em .gitlab-ci.yml), então a
  # topologia de rede nunca é commitada no repositório. OLLAMA_MODEL/
  # OLLAMA_EMBED_MODEL/LLM_PROVIDER (não sensíveis) continuam aqui.
  OLLAMA_MODEL: "mistral:7b-instruct"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  LLM_PROVIDER: "ollama"

  # Sentry environment tag
  SENTRY_ENVIRONMENT: "production"

  # Production security settings
  # NPM faz SSL termination — Django não precisa redirecionar para HTTPS
  SECURE_SSL_REDIRECT: "False"
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"

  # Django settings
  PYTHONUNBUFFERED: "1"
  DJANGO_SETTINGS_MODULE: "app.settings"
  LOG_FORMAT: "json"
  TZ: "America/Sao_Paulo"

# =============================================================================
# Axiom — kustomize base
# =============================================================================
# Shared shape for every environment. Values here reflect the production
# footprint (bigger resource requests/limits, etc.) — overlays/staging patches
# values *down* and removes prod-only features that don't apply to staging
# (see overlays/staging/kustomization.yaml).
#
# PostgreSQL is NOT here: it runs self-managed on the same VPS as k3s, outside
# the cluster, for both staging and production (see
# documentation/database/infrastructure.md). DB_HOST/DB_PORT are deliberately
# absent from configmap.yaml — they're injected into the axiom-secrets Secret
# from CI/CD variables at deploy time instead, alongside DB_NAME/DB_USER/
# DB_PASSWORD. Only DB_SSLMODE (non-sensitive) stays in the ConfigMap.
#
# MinIO is ALSO NOT here: it runs external to the cluster, on its own host,
# fronted by a publicly-trusted TLS certificate (see
# documentation/storage/infrastructure.md). There is no more in-cluster
# Deployment/Service/PVC/cert-manager Certificate for it, and no more
# self-signed internal CA machinery — MINIO_ENDPOINT/MINIO_EXTERNAL_ENDPOINT
# are injected into the axiom-secrets Secret from CI/CD variables at deploy
# time, alongside MINIO_ROOT_USER/MINIO_ROOT_PASSWORD. Only MINIO_BUCKET_NAME
# and MINIO_USE_SSL (non-sensitive) stay in the ConfigMap.
#
# Ollama is ALSO NOT here, same reasoning: it runs self-managed, external to
# the cluster (see documentation/llm/infrastructure.md). There is no more
# in-cluster Deployment/Service/PVC for it — OLLAMA_BASE_URL is injected into
# the axiom-secrets Secret from CI/CD variables at deploy time, alongside the
# optional cloud fallback keys (GROQ_API_KEY/ANTHROPIC_API_KEY/
# OPENAI_API_KEY). Only OLLAMA_MODEL/OLLAMA_EMBED_MODEL/LLM_PROVIDER
# (non-sensitive) stay in the ConfigMap.
#
# The API Deployment(s) are intentionally NOT here: production uses a real
# blue-green pair (api-blue/api-green) while staging uses a single Recreate
# Deployment. Those live directly in each overlay (overlays/<env>/api/).
#
# api/service.yaml is ALSO not here, deliberately: its selector is toggled
# between slot:blue/slot:green by blue-green-switch.sh on every production
# deploy, so it must never be reset by a blanket `kubectl apply`. Production
# applies it once at bootstrap (create-if-missing) from overlays/production/
# api/service.yaml. Staging has no such concern, but kustomize's load
# restrictor forbids overlays from reaching into base/ for a single loose
# file (only whole kustomization directories), so overlays/staging/api/
# keeps its own copy rather than sharing this one. api/pvc.yaml has no such
# risk and is shared here.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - cluster-issuers.yaml
  - serviceaccounts.yaml
  - network-policy.yaml
  - resource-quota.yaml
  - ingress.yaml
  - redis/pvc.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - frontend/configmap-nginx.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - api/pvc.yaml

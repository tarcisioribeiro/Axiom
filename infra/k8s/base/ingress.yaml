# Ingress — routes external traffic to the frontend and API services.
#
# Path priority (evaluated top-to-bottom by nginx):
#   /api/**    → api-service:39100   (Django REST API)
#   /admin/**  → api-service:39100   (Django admin)
#   /static/** → api-service:39100   (collected static files)
#   /media/**  → api-service:39100   (user-uploaded media)
#   /live/**   → api-service:39100   (liveness probe — always 200)
#   /health/** → api-service:39100   (health check — 200/503)
#   /ready/**  → api-service:39100   (readiness probe — 200/503)
#   /**        → frontend-service:80 (React SPA — catch-all, must be last)
#
# ClusterIssuers referenced below live in base/cluster-issuers.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axiom-ingress
  namespace: axiom
  labels:
    app.kubernetes.io/name: axiom
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # NPM faz SSL termination — ingress não precisa redirecionar
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - axiom.tjtux.duckdns.org
      secretName: axiom-tls
  rules:
    - host: axiom.tjtux.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 39100
          # Catch-all: React SPA — must remain last
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
